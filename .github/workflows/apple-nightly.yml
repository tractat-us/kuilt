name: apple-nightly

# Apple Kotlin/Native lane — out of band, NOT part of ci-required.
#
# WHY THIS EXISTS
#   ci.yml runs its whole KMP build (build-jvm + build-native) on ubuntu-latest.
#   The Apple K/N *test executions* — macosArm64Test and iosSimulatorArm64Test —
#   cannot run on Linux: their test binaries target arm64 Darwin, so on the
#   ubuntu build-native job those `*Test` tasks are effectively skipped and the
#   required `ci-required` check goes green without ever compiling+running the
#   Apple targets. Apple-target breakage stays invisible until someone builds
#   locally on a Mac (see #933).
#
# THE DECISION (deliberately cheap)
#   Keep per-PR CI Linux-only; run the full Apple lane on a scheduled nightly
#   build on a macOS runner. This lane is NOT wired into `ci-required` and is NOT
#   a required status check — a red run here notifies out of band without blocking
#   any PR merge. Trigger it on demand with `gh workflow run apple-nightly.yml`
#   (workflow_dispatch).
#
#   WHY OUT OF BAND — concurrency, not cost. This repo is PUBLIC, so GitHub-hosted
#   standard runners (macos-latest included) are free at every size; there is no
#   billing multiplier to appeal to, and an earlier version of this comment claiming
#   "~10x Linux" was simply wrong. The real ceiling is that GitHub caps a plan at
#   FIVE concurrent macOS jobs regardless of visibility. ci.yml fires ~25 runs/hour.
#   On green scheduled `main` runs from Oct 26 to Nov 13 2026 the Apple tests took
#   15-54 min as one job, and on Nov 14 and 15 they hit its 60-min limit (#3115). Split per
#   target, each leg takes 39-50 min under a 90-min limit.
#   Putting that lane on every PR would sit permanently at the cap and queue every
#   merge behind it. A scheduled run fills the cap on its own: the two `apple`
#   targets, `apple-extras`, `abi` and `webkit` are five macOS jobs at 07:00.
#
#   The same reasoning makes this lane the home for the `:spike` compile (#1796):
#   :spike is Apple-only and depends on the cinterop-bearing :kuilt-nw, so it needs
#   a Mac host too. ci.yml gates it only when a PR edits spike/ sources; a kuilt
#   change that breaks :spike without touching spike/ is caught here instead.

on:
  schedule:
    # 07:00 UTC daily — a low-traffic hour; runs once per day off the default branch.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      update_abi:
        description: >-
          Regenerate every module's ABI dump on macOS and upload it as the abi-dumps artifact,
          instead of running the lane. Use it after a deliberate API change, or to refresh Apple
          drift (#2684).
        type: boolean
        default: false
      webkit_only:
        description: >-
          Run only the WebKit job (:kuilt-identity's wasmJs tests in Playwright WebKit, #3246),
          skipping the Apple K/N and ABI jobs.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ── apple ────────────────────────────────────────────────────────────────
  # Compiles and RUNS the Apple K/N test targets on a real macOS arm64 runner —
  # the executions ci.yml's ubuntu build-native can only skip. Standalone: no
  # dependency on ci.yml, not referenced by ci-required.
  #
  # ONE JOB PER TARGET (#3115). Until Nov 15 2026 both targets ran one after the other in one job,
  # with the stamp-invariance, :spike and bridge steps behind them, under a single 60-min limit.
  # Three scheduled runs in a row then timed out. The cause was test growth in one module:
  # :kuilt-heddle-core's K/N tests went from 0 to 32 min per target (601 tests, macosArm64,
  # run 43688308596) between Nov 13 and 15. On this 3-vCPU runner at --max-workers=2 that left
  # the test step needing an estimated 75-85 min. Split per target, each leg pays for one target's
  # compile and tests, and gets its own limit, now 90 minutes. The steps that are not tests moved to
  # `apple-extras`, so they no longer eat into a test budget either.
  #
  # `fail-fast: false` and `--continue` for the same reason: one red must not hide the rest. In
  # run 43736319946 a single macOS failure stopped Gradle, and iosSimulatorArm64Test never ran.
  #
  # 90 minutes, not 60 (#3115). Split, a leg's test step took 39-50 min on `main` and on
  # branches alike, and :kuilt-heddle-core alone took 27-31 min of that in one test binary.
  # A leg killed at its limit gives no verdict, so the extra time costs a macOS slot only on a
  # run that would otherwise be wasted.
  # Every job here writes the Gradle cache from `main` only, as ci.yml has since #3496. A branch
  # dispatch reads `main`'s entries. Writing its own would evict them from the full 10 GB store,
  # and an evicted cache is what made the slow branch runs slow (#3115).
  apple:
    # A dispatch with update_abi wants the dumps, not the tests, so this job sits it out.
    if: ${{ !inputs.update_abi && !inputs.webkit_only }}
    name: apple (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [macosArm64, iosSimulatorArm64]
    steps:
      - uses: actions/checkout@v7

      # JDK 25, like every job. On this aarch64 runner it is also a floor: JDK 21-23 miscompile hot
      # integer code under C2 once it warms up (#1597), so this job must not go below 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+100000002.0.LTS'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Kotlin/Native toolchain + dependencies. setup-gradle caches ~/.gradle but
      # not ~/.konan, so without this every run re-downloads konan and recompiles
      # the native targets cold. Keyed on the toolchain-defining files, matching
      # ci.yml's konan cache step (macOS-scoped runner.os key).
      - name: Restore Kotlin/Native (~/.konan)
        id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # The load sample comes before the tests, so a run that times out mid-test still carries it.
      - name: Runner sample
        run: >-
          echo "Runner: $(sysctl -n hw.ncpu 2>/dev/null || echo '?') vCPU,
          $(( $(sysctl -n hw.memsize 2>/dev/null || echo 0) / 1073741824 )) GB — $(uptime || true)"

      # Resource caps — the arm64 macos-latest runner is the SMALLEST in the fleet
      # (3 vCPU / 7 GB), and without these this lane has never been green (#1299).
      # gradle.properties is tuned for a workstation: org.gradle.workers.max=16 and
      # -Xmx4g for BOTH long-lived daemons (Gradle + Kotlin). Inherited bare onto
      # this runner that means up to 16 concurrent workers (several CPU-bound K/N
      # test binaries + the iOS simulator at once) on 3 cores, under ~8 GB of daemon
      # heap on a 7 GB box — measured ~10-20x wall-clock slowdown vs a dev Mac
      # (DealSessionTest: 11.5s local → 223s here). The K/N tests are virtual-time
      # runTest bodies whose timeouts (5s/30s/60s) are WALL-clock, so the slowdown
      # surfaces as UncompletedCoroutinesError on whichever tests are heaviest that
      # run — not a code regression. Same two levers as ci.yml's build jobs:
      # --max-workers=2 caps the additive peak (2 workers on 3 vCPU, matching
      # ci.yml's 2-on-4 ratio) and CI-only daemon-heap caps drop the resident floor
      # (2g+3g = 5 GB, leaving headroom for the OS, test binaries, and simulator on
      # 7 GB; the Kotlin daemon keeps the larger share — K/N compilation lives there).
      - name: ${{ matrix.target }} K/N tests
        run: >-
          ./gradlew ${{ matrix.target }}Test --continue --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # `FairSharePool`'s real-thread probe on Kotlin/Native (#3573). ci.yml's concurrency-probes
      # job runs it on the JVM; K/N has no Linux host, so this leg is its only CI run. One module,
      # after the full step, so it runs alone on the runner. The test binary is the one just linked:
      # the flag only lifts a test filter. The objection ci.yml records against putting a K/N probe
      # here, that a wedge on this slow runner has no cap to make it a named failure, does not hold
      # for this one: it bounds itself in real time and fails with the pool's counters well inside
      # its 30 s backstop. Its run replaces the module's macosArm64Test results in the artifact
      # below, so the probe's XML is the one uploaded; the full step's verdict is in its own log.
      - name: :kuilt-heddle-coroutines concurrency probe (macosArm64)
        if: ${{ always() && matrix.target == 'macosArm64' }}
        run: >-
          ./gradlew :kuilt-heddle-coroutines:macosArm64Test --max-workers=2
          -Pconcurrency.stress.tests=true --tests "*ConcurrencyTest"
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # Only `main` writes ~/.konan, as in ci.yml (#3115).
      - name: Save Kotlin/Native (~/.konan)
        if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      # Per-module wall time for every test task, in the run's summary, with a warning on any task
      # over 40 min. One module's tests reached 32 min per target without a word until the job
      # timed out (#3115). `always()` so a red or timed-out run reports too; it never fails.
      #
      # 40, not the first 15. Across six runs on 2026-11-16 :kuilt-heddle-core took 16-32 min a
      # target, so 15 warned every night; the next slowest task took about 6. The test step took
      # 25-52 min and the whole leg 31-53, against the 90 above. A task at 40 min puts a leg near
      # an hour, which still leaves half an hour before the timeout eats the verdict.
      - name: Test-task durations
        if: always()
        run: python3 .github/scripts/test-durations.py --warn-minutes 40 --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-apple-${{ matrix.target }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  # ── apple-extras ─────────────────────────────────────────────────────────
  # The macOS checks that are not the K/N test runs: stamp invariance on the Apple targets, the
  # :spike compile and the JVM bridge tests. Until #3115 they ran behind both test targets in
  # `apple` and shared its 60 minutes. Here they have their own, and a slow test task cannot
  # starve them. Same runner and the same resource caps as `apple`.
  apple-extras:
    if: ${{ !inputs.update_abi && !inputs.webkit_only }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # JDK 25 floor on aarch64, as in the `apple` job (#1597).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+100000002.0.LTS'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore Kotlin/Native (~/.konan)
        id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # The stamp-invariance check needs a first pass at the default version, so that every task it
      # selects has history to be up to date against. In `apple` that pass was the test run. Here
      # it is the selection itself: every macosArm64 and iosSimulatorArm64 compilation, main and
      # test, and no links or test runs.
      - name: Compile the Apple targets (stamp-invariance first pass)
        run: >-
          ./gradlew stampProbeTargets -Pkuilt.stampProbe.family=apple --continue --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # Only `main` writes ~/.konan, as in ci.yml (#3115).
      - name: Save Kotlin/Native (~/.konan)
        if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      # The Apple-native half of ci.yml's stamp-invariance step (#3464): the step above is the
      # first pass, and this re-runs its macosArm64 and iosSimulatorArm64 compilations at a
      # different -Pversion, failing on any that re-ran outside the allowlist. A klib carries every
      # literal, so on native a dependency on :kuilt-base recompiles on every snapshot. Same daemon
      # arguments as above so the warm daemon is reused. `!cancelled()`, like the spike step: a
      # compile failure above must not hide a leak.
      - name: Stamp invariance on Apple native (#3464)
        if: ${{ !cancelled() }}
        run: >-
          .github/scripts/stamp-invariance.sh apple --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # #1796: `:spike` is the two-iPhone hardware-validation harness for #1712, and
      # until now NOTHING in CI compiled it — it is excluded from the root Gradle graph
      # unless `-PincludeSpike` is passed, and no workflow passed it. It depends on
      # :kuilt-core, :kuilt-session and :kuilt-nw, so any source-incompatible change to
      # those broke it silently; the break then surfaced when someone tried to build the
      # app for a field test, i.e. at exactly the moment they wanted an answer.
      #
      # This lane is the right home for the LIBRARY-side half of that gap: ci.yml's
      # spike-compile job is path-filtered to spike/ sources (macOS runners are capped
      # at 5 concurrent jobs plan-wide, so it must not fire on every PR), which leaves
      # the case where kuilt code changes and spike/ does not. That case lands here,
      # within 24 h, and the alert step below turns a red run into a tracking issue.
      #
      # Marginal cost is small: this runner is already up with a warm konan cache, and
      # the macosArm64/iosSimulatorArm64 dependency klibs are already built by the
      # first-pass compile above. Compile only — no tests (there are none), no framework
      # link, no Xcode app target (that one genuinely needs signing, which is why :spike
      # was excluded in the first place).
      #
      # `!cancelled()` rather than the default success(): a compile or stamp failure above
      # must not hide a spike break. The signals are independent and all feed the same
      # failure alert.
      - name: Compile :spike for its Apple targets (#1796)
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew -PincludeSpike
          :spike:compileKotlinIosArm64
          :spike:compileKotlinIosSimulatorArm64
          :spike:compileKotlinMacosArm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # #2487: `NwBridgeLoopbackConformanceTest` drives NwLoom over the JVM bridge
      # (BridgeNwApi → libkuilt.dylib → RealNwApi) against a real 127.0.0.1 TLS-PSK link — JNA
      # marshalling, StableRef lifecycle, the callback→flow bridge and the handshake, end to end.
      # Until now it executed in ZERO lanes, ever. It is a `jvmTest`, so ci.yml schedules it on
      # build-jvm (ubuntu-latest), where NwNativeLib.load() returns null off macOS and newLoomPair
      # throws AssumptionViolatedException — JUnit records a clean SKIP and the lane goes green
      # having proven nothing. No other lane runs jvmTest on a macOS host: this workflow ran only
      # the K/N targets, and ci.yml's spike-compile is compile-only.
      #
      # It needs no new toolchain: packageMacosNatives copies libkuilt.dylib from
      # linkReleaseSharedMacosArm64 into jvmMain's resources under darwin-aarch64/ (JNA's
      # platform-resource convention), and that task is genuinely in :kuilt-nw:jvmTest's graph —
      # verified from the task graph, not assumed, because a dylib that never reaches the test
      # classpath would make this step skip on macOS too and re-buy the same false green.
      #
      # LAST among this job's work steps deliberately. The K/N *release* shared link is the one
      # cost it adds, so if it ever threatens the 60-minute timeout it must not starve the stamp
      # check or the :spike compile above. `!cancelled()` for the same reason those carry it: the
      # signals are independent. Non-gating like everything here (5-concurrent-macOS-job cap, see
      # the header); the alert job below turns a red scheduled run into a tracking issue.
      #
      # #2466's interim rule: a :kuilt-nw conformance verdict without a load sample is
      # uninterpretable. This suite's whole subject is a real socket on real GCD queues, and this
      # runner is measured 10-20x slower than a dev Mac. So the sample is taken just before the
      # suite runs, and a failing or timed-out run carries it. Never fatal.
      - name: Runner sample before the bridge tests
        if: ${{ !cancelled() }}
        run: >-
          echo "Runner: $(sysctl -n hw.ncpu 2>/dev/null || echo '?') vCPU,
          $(( $(sysctl -n hw.memsize 2>/dev/null || echo 0) / 1073741824 )) GB — $(uptime || true)"

      - name: JVM bridge tests on a real macOS host (#2487)
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :kuilt-nw:jvmTest --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # A green tick here is NOT the receipt — a suite that self-skips is also green. The signal is
      # that NwBridgeLoopbackConformanceTest reports at least one test that was not skipped; only
      # that suite's XML is checked. Fails the step (and so the lane) if the XML is
      # missing, empty, or all-skipped, which is exactly the regression that would silently undo
      # #2487: anything that stops the dylib reaching the test classpath returns the suite to a
      # clean, invisible skip.
      - name: Assert the bridge suite EXECUTED (#2487)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          XML=kuilt-nw/build/test-results/jvmTest/TEST-us.tractat.kuilt.nw.NwBridgeLoopbackConformanceTest.xml
          if [ ! -f "$XML" ]; then
            echo "::error::$XML is absent — the bridge conformance suite did not run at all."
            exit 1
          fi
          # Attribute order is not guaranteed, so read each independently rather than positionally.
          read_attr() { sed -n 's/.*[[:space:]]'"$1"'="\([0-9]*\)".*/\1/p' "$XML" | head -1; }
          TESTS=$(read_attr tests); SKIPPED=$(read_attr skipped)
          echo "NwBridgeLoopbackConformanceTest: tests=${TESTS:-?} skipped=${SKIPPED:-?}"
          if [ -z "${TESTS:-}" ] || [ "$TESTS" -eq 0 ]; then
            echo "::error::Bridge suite reported no tests — dylib absent from the test classpath?"
            exit 1
          fi
          if [ "${SKIPPED:-0}" -eq "$TESTS" ]; then
            echo "::error::All $TESTS bridge tests SKIPPED — NwNativeLib.load() returned null. False green."
            exit 1
          fi
          echo "Bridge suite executed $((TESTS - ${SKIPPED:-0}))/$TESTS tests on a real macOS host."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-apple-extras
          path: |
            build/stamp-probe/
            kuilt-nw/build/reports/tests/
            kuilt-nw/build/test-results/

  # ── abi ──────────────────────────────────────────────────────────────────
  # The macOS half of the ABI gate (#2684). ci.yml's build-jvm runs `checkKotlinAbi` on every PR
  # on Linux, through `build` -> `check`. Linux checks every target's dump of every module whose
  # Apple targets cross-compile there. It cannot compile the Apple targets of a module with a
  # cinterop (today :kuilt-nw, :kuilt-otel-logging, :kuilt-warp-runtime), and KGP would then infer
  # their Apple dump from wasmJs, so the convention plugin skips the ABI tasks for those modules
  # off macOS and Linux checks none of their targets. They are ABI-checked on macOS only, on every
  # target, JVM and Android included: here, so their drift surfaces within 24 h of the merge that
  # caused it.
  #
  # A separate job, not a step of `apple`: the dump compiles every target of every module, and an
  # `apple` leg has its own tests to fit in its limit. Out of band like the rest of this file.
  #
  # On a red check, or on a dispatch with update_abi, it runs `updateKotlinAbi` and uploads the
  # result as the `abi-dumps` artifact. To refresh: download that artifact over the repo root, read
  # the diff, and commit it with a sentence saying which change it records.
  abi:
    if: ${{ !inputs.webkit_only }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # JDK 25 floor on aarch64, as in the `apple` job (#1597).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+100000002.0.LTS'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore Kotlin/Native (~/.konan)
        id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # Same resource caps as the `apple` job, for the same 3 vCPU / 7 GB runner. --continue so
      # one red module does not hide the next.
      - name: Check the public ABI on macOS (#2684)
        if: ${{ !inputs.update_abi }}
        run: >-
          ./gradlew checkKotlinAbi --continue --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      - name: Regenerate the ABI dumps
        if: ${{ inputs.update_abi || failure() }}
        run: >-
          ./gradlew updateKotlinAbi --continue --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      - name: Upload the regenerated dumps
        if: ${{ inputs.update_abi || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: abi-dumps
          path: kuilt-*/api/
          if-no-files-found: error

  # ── webkit ───────────────────────────────────────────────────────────────
  # :kuilt-identity's wasmJs tests in Playwright's WebKit (#3246). Safari and WebKit refuse a
  # compressed P-256 importKey("raw") (#3232), while the JDK, CryptoKit and ChromeHeadless all
  # accept it, so if the module went back to importing the compressed form every per-PR test would
  # stay green and every Safari user would break. Measured with that regression planted: 22 of 75
  # tests red here, 0 of 78 in ChromeHeadless.
  #
  # Why here and not ci.yml: the task exists only under -Pidentity.webkit.tests=true, and it runs on
  # macOS because that is the WebKit build #3232 measured against real Safari. Its own job, not a
  # step of `apple`, because it needs no Kotlin/Native and each `apple` leg has its own tests to fit.
  # Out of band like the rest of this file; the alert job below turns a red scheduled run into an
  # issue.
  webkit:
    if: ${{ !inputs.update_abi }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+100000002.0.LTS'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # playwright-core is a devNpm dependency of :kuilt-identity's wasmJs tests, so the npm
      # install puts it in build/wasm/node_modules; its own CLI then fetches the WebKit build that
      # version expects, the one the launcher in kuilt-identity/karma-webkit.d/ starts.
      - name: Install Playwright WebKit
        run: |
          ./gradlew kotlinWasmNpmInstall --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvmargs="-Xmx3g"
          node build/wasm/node_modules/playwright-core/cli.js install webkit

      - name: kuilt-identity wasmJs tests in WebKit (#3246)
        run: >-
          ./gradlew :kuilt-identity:wasmJsBrowserWebkitTest -Pidentity.webkit.tests=true
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      # A green task is not the receipt: the run must have executed tests, in WebKit. Fails if the
      # XML is missing, counts no tests, or names an engine other than Safari/WebKit.
      - name: Assert the suite ran in WebKit (#3246)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          DIR=kuilt-identity/build/test-results/wasmJsBrowserWebkitTest
          if ! ls "$DIR"/*.xml >/dev/null 2>&1; then
            echo "::error::$DIR has no results — the WebKit run did not happen."
            exit 1
          fi
          TESTS=$(cat "$DIR"/*.xml | sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' | awk '{t+=$1} END {print t+0}')
          ENGINES=$(grep -oh 'browser, [A-Za-z]*' "$DIR"/*.xml | sort -u | tr '\n' ' ')
          echo "WebKit run: tests=$TESTS engines=[$ENGINES]"
          if [ "$TESTS" -eq 0 ]; then
            echo "::error::The WebKit run reported no tests."
            exit 1
          fi
          if [ "$ENGINES" != "browser, Safari " ]; then
            echo "::error::Expected every test to report the Safari/WebKit engine, got [$ENGINES]."
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-webkit
          path: |
            kuilt-identity/build/reports/tests/
            kuilt-identity/build/test-results/

  # Backstop: this lane is out of band and gates nothing, so a red run is
  # silent (that's how #1299 stayed red for a week unnoticed). Mirror of
  # publish.yml's alert: open (or refresh) ONE tracking issue per breakage.
  # Idempotent by exact title; best-effort — the failed jobs are the signal
  # that matters, so the alert never fails the run further. Scheduled runs
  # only: a red workflow_dispatch on a topic branch is the dispatcher's
  # business, not a main-lane breakage. Its own job, so a red `apple` leg, a red
  # `apple-extras`, a red `abi` and a red `webkit` each raise it.
  #
  # A job that hits its `timeout-minutes` ends `cancelled`, not `failure`, and `failure()` is false
  # for it — so under `if: failure()` the three timed-out `apple` runs of Nov 14-15 skipped this job
  # and the lane went silent for two days (#3115). Hence the explicit `needs.*.result` test, behind
  # `always()` so the implicit `success()` does not gate it. The cost: a human cancelling a scheduled
  # run also raises the issue, which is cheap to close and far rarer than a timeout.
  alert:
    needs: [apple, apple-extras, abi, webkit]
    if: >-
      ${{ always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    # Job-level override of the workflow default (contents: read). issues: write
    # lets this job open/refresh the "apple-nightly red" issue.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Alert on nightly failure
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repository named.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          APPLE_RESULT: ${{ needs.apple.result }}
          EXTRAS_RESULT: ${{ needs.apple-extras.result }}
          ABI_RESULT: ${{ needs.abi.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          set -eu
          TITLE="apple-nightly failing on main"
          LABEL="apple-nightly-red"
          BODY="A job in the macOS nightly workflow (\`apple-nightly.yml\`) failed or was cancelled. The job list below says which.

          - Failing run: ${RUN_URL}
          - Commit: ${COMMIT_SHA}
          - Jobs: apple=${APPLE_RESULT}, apple-extras=${EXTRAS_RESULT}, abi=${ABI_RESULT}, webkit=${WEBKIT_RESULT}

          A \`cancelled\` job on a scheduled run almost always hit its \`timeout-minutes\`, so its tests never finished: no verdict, not a pass.

          A red \`apple\` job means the Apple K/N tests failed in at least one of its two legs, \`macosArm64\` and \`iosSimulatorArm64\`; the run page says which. This is the ONLY lane that executes them (ci-required's ubuntu build skips them), so Apple-target regressions are invisible until this is green again. Each leg's reports are attached as \`test-reports-apple-<target>\`, and its run summary has a per-module duration table.

          A red \`apple-extras\` job means stamp invariance on the Apple targets (#3464), the \`:spike\` compile (#1796) or the JVM bridge tests on macOS (#2487) failed. The step that failed says which. Its reports are in \`test-reports-apple-extras\`.

          A red \`abi\` job means the public ABI on macOS no longer matches the committed dumps (#2684). The run carries the regenerated dumps as the \`abi-dumps\` artifact: unpack it over the repo root, read the diff, and commit it if the change was meant.

          A red \`webkit\` job means \`:kuilt-identity\`'s wasmJs tests failed in Playwright WebKit. The likeliest cause is that the module imports a compressed P-256 point again, which Safari and WebKit refuse while every per-PR target accepts it (#3246, #3232). Its reports are in the \`test-reports-webkit\` artifact."

          # Best-effort label create (idempotent). Title-based search below doesn't
          # depend on it, so a failure here is tolerated.
          gh label create "$LABEL" --color B60205 \
            --description "apple-nightly.yml is failing on main; Apple K/N, ABI or WebKit regressions invisible" 2>/dev/null || true

          # Find an existing OPEN issue by exact title (title-based idempotency —
          # no label dependency). Comment on it if present; otherwise open one.
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Refreshing existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening new tracking issue"
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
