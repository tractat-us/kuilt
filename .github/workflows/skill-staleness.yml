name: skill-staleness

# Producer-side freshness check for the agent-facing docs: the always-loaded
# `.claude/skills/kuilt-primitives/SKILL.md`, and each family's pair of
# `docs/agent-cookbook/<family>.md` + `.claude/rules/<family>.md` (#2769).
#
# WHY THIS EXISTS
#   The skill is how a coding agent in a CONSUMER repo discovers what kuilt already
#   ships. Consumers vendor a byte-identical copy and refresh it daily, so a route
#   that is missing here is missing everywhere downstream.
#
#   The failure is silent and fails OPEN. Nothing errors when a primitive has no
#   route — an agent simply hand-rolls a parallel one, and catching it needs a
#   reviewer who knows kuilt well. That is the same shape as a guard test that
#   quietly stops matching, so it needs a job rather than good intentions.
#
#   Two freshness obligations exist and they are DIFFERENT mechanisms; do not
#   conflate them:
#
#     canonical vs library   "does the skill describe what we ship today?"
#                            → CLAUDE.md's same-PR rule, plus THIS job
#     vendored vs canonical  "is the consumer's copy current?"
#                            → the consumer's own daily sync-PR workflow
#
#   Only the second can be fully automated. No job can tell that a newly-added
#   class WAS a routable primitive, so this one measures the proxy it can measure:
#   published source moved, and the skill did not follow within 7 days.
#
# WHY IT OPENS AN ISSUE RATHER THAN FAILING A BUILD
#   A stale skill is not a reason to block someone else's merge. A required check
#   that reddens whenever the library moves would push the cost onto whoever
#   happens to open the next PR, and would be muted within a week. This is
#   deliberately out of band — it is NOT part of `ci-required`.
#
# WHY THE MODULE LIST IS DERIVED, NOT LISTED
#   Same marker the BOM uses (#1044): published ⟺ the module applies `kuilt.publish`,
#   directly or via `kuilt.kmp-library`. A hand-maintained list drifted twice there
#   before it was derived, and a hardcoded list here would rot the same way — a new
#   module's primitives would be invisible to the very check meant to notice them.
#   Grepping the marker needs no Gradle, so this job stays a few seconds long.
#
#   Scoped to `src/commonMain` of those modules: that is what consumers import.
#   NOT `src/*Test`, NOT `src/commonSamples`, NOT `docs/`. A test-only or sample
#   change is not a missing route, and a check that cries wolf gets ignored.
#
# WHAT THAT SCOPE DOES NOT WATCH
#   Said out loud because it is invisible in a green run: a published module with
#   NO `src/commonMain` contributes no watched path to EITHER arm, and is dropped
#   with no message. For most such modules the omission is honest —
#   `:kuilt-otel-log4j2`, `:kuilt-otel-logback`, `:kuilt-otel-sdk`,
#   `:kuilt-warp-compiler` and `:kuilt-warp-ksp` are JVM/Android-only, so there is
#   no common tree a consumer imports, and `:kuilt-bom` is a `java-platform` with
#   no source at all.
#
#   `:kuilt-warp-runtime` is the exception, and the one worth knowing: published,
#   `kuilt.kmp-library` so every target, and its entire public surface sits in
#   `appleMain`, `jvmMain` and `wasmJsMain` rather than a common one — so not a
#   line of it is watched by either arm. Pre-existing scope, recorded rather than
#   changed here (#2794). Widening to every `src/*Main` is a separate decision,
#   because it would also start watching the five modules above, where dropping
#   them is correct.
#
# TWO ARMS, AND WHY THE SECOND IS NOT A FINER SIEVE OF THE FIRST
#   The skill arm asks "does the always-loaded routing surface describe what we
#   ship today?" and measures ONE file against EVERY published `commonMain`,
#   because the skill is loaded for every session in every consumer repo.
#
#   That comparison cannot see a FAMILY go stale, and not by a small margin. A
#   single touch of `SKILL.md` clears it for all seven families at once, so a
#   cookbook page nobody has opened in a year sits behind a green check — while
#   the busiest module in the repo keeps the shared `src` timestamp young enough
#   that a quiet family's own drift never shows up as days at all.
#
#   So the family arm re-asks the same question one scope down: each family's
#   docs against THAT family's modules, reported under its OWN issue title. The
#   two titles must stay distinct — each is the idempotency key its arm looks
#   itself up by, so a shared title would have one arm closing the other's issue
#   and re-opening it on the next run, forever.
#
#   The newer of the family's two files counts. `docs/agent-cookbook/<family>.md`
#   is where a route's compiled snippet lands and `.claude/rules/<family>.md` is
#   where its convention does, and touching either is an honest record that
#   somebody looked at what moved.
#
# WHY THE FAMILY → MODULES MAP IS READ, NOT LISTED
#   Same reason the module list above is derived: it is already written down, in
#   each rule file's `paths:` frontmatter, and `verifyFamilyRules` in the root
#   build fails when a `:kuilt-*` module is claimed by other than exactly one of
#   them. A second copy here could only ever be the stale one — and the family it
#   forgot would be the family this job never checks.
#
#   The parse below mirrors that guard's line-by-line walk — but it is NOT a
#   parity check, and exactly one disagreement is caught: if this walk reads ZERO
#   `"<dir>/**"` globs out of a file the guard guarantees has at least one, the
#   family arm errors instead of quietly watching nothing.
#
#   A PARTIAL disagreement is silent, and that is a deliberate limit rather than
#   an oversight. A glob this walk cannot read — one not ending `/**`, or a CRLF
#   line whose trailing quote survives the strip — is dropped, and as long as one
#   other glob survives, the family is still checked, just over fewer modules,
#   with nothing saying so. That is tolerable because the broader guarantee comes
#   from `verifyFamilyRules` upstream, not from here: it is wired into `check` →
#   `build` → `ci-required`, it FAILS outright on a glob that does not end `/**`,
#   and Kotlin's `readLines()` strips CRLF before it ever looks. Both shapes are
#   blocked at merge time, so this job cannot be the first thing to meet one.

on:
  schedule:
    # 06:30 UTC daily — ahead of consumers' own sync jobs, and off apple-nightly's 07:00.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: both timestamps come from `git log`, and a shallow clone
      # would report the checkout's own commit for every path.
      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0

      - name: Compare skill mtime against published source
        id: check
        env:
          SKILL: .claude/skills/kuilt-primitives/SKILL.md
          MAX_DAYS: '7'
        run: |
          set -euo pipefail

          test -f "$SKILL" || {
            echo "::error::$SKILL is missing — the canonical skill has been deleted or moved."
            exit 1
          }

          # Published ⟺ applies kuilt.publish (directly or via kuilt.kmp-library).
          mapfile -t MODULES < <(
            grep -l -E 'id\("kuilt\.(publish|kmp-library)"\)' ./*/build.gradle.kts \
              | xargs -r -n1 dirname \
              | sed 's|^\./||' \
              | sort
          )
          if [ "${#MODULES[@]}" -eq 0 ]; then
            echo "::error::derived zero published modules — the kuilt.publish marker or the module layout changed."
            exit 1
          fi

          PATHS=()
          for m in "${MODULES[@]}"; do
            [ -d "$m/src/commonMain" ] && PATHS+=("$m/src/commonMain")
          done
          if [ "${#PATHS[@]}" -eq 0 ]; then
            echo "::error::derived zero commonMain trees from ${#MODULES[@]} published modules."
            exit 1
          fi
          echo "Watching ${#PATHS[@]} published commonMain trees across ${#MODULES[@]} modules."

          SKILL_TS=$(git log -1 --format=%ct -- "$SKILL")
          SRC_TS=$(git log -1 --format=%ct -- "${PATHS[@]}")
          echo "skill=$SKILL_TS src=$SRC_TS"

          STALE=no
          DAYS=0
          if [ "$SRC_TS" -gt "$SKILL_TS" ]; then
            DAYS=$(( (SRC_TS - SKILL_TS) / 86400 ))
            [ "$DAYS" -gt "$MAX_DAYS" ] && STALE=yes
          fi

          {
            echo "stale=$STALE"
            echo "days=$DAYS"
          } >> "$GITHUB_OUTPUT"

          if [ "$STALE" = yes ]; then
            # Name the modules that moved since the skill did — that is the whole
            # actionable content, and it is what turns "go re-read 45 modules" into
            # "go look at these three".
            MOVED=$(
              git log --since="@$SKILL_TS" --name-only --format= -- "${PATHS[@]}" \
                | grep -v '^$' | cut -d/ -f1 | sort -u | sed 's/^/- `:/;s/$/`/'
            )
            {
              echo 'moved<<MOVEDEOF'
              echo "$MOVED"
              echo 'MOVEDEOF'
            } >> "$GITHUB_OUTPUT"
            echo "::warning::published source moved ${DAYS}d ahead of the skill"
          else
            echo "Skill is current (published source is ${DAYS}d ahead; budget is ${MAX_DAYS}d)."
          fi

      # Idempotent by exact title: an existing OPEN issue is commented on, never
      # duplicated. Same shape as publish.yml / apple-nightly.yml's alerts.
      - name: Open or refresh the tracking issue
        if: steps.check.outputs.stale == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DAYS: ${{ steps.check.outputs.days }}
          MOVED: ${{ steps.check.outputs.moved }}
        run: |
          set -eu
          TITLE="kuilt-primitives skill is behind the library"
          LABEL="skill-stale"
          BODY="Published \`src/commonMain\` last moved **${DAYS} days** after \`.claude/skills/kuilt-primitives/SKILL.md\` was last updated. The budget is 7 days (see CLAUDE.md, \"The \`kuilt-primitives\` skill is part of the public surface\").

          Modules whose published source moved since the skill did:

          ${MOVED}

          **This is a proxy, not a verdict.** The job cannot tell a new *primitive* from an internal refactor, so the answer may legitimately be \"nothing to route\" — in which case a one-line touch of the skill is the honest way to record that someone looked.

          What to check:
          1. Did any of those modules gain a **public** primitive a consumer would otherwise hand-roll? If so it needs a STOP-list route and the \`description\` trigger phrases that reach it — and that \`description\` is a FIXED budget, so adding a trigger there means removing one (#2662) — plus a section in that module's family page, \`docs/agent-cookbook/<family>.md\`, with a row pointing at it from the \`docs/agent-cookbook.md\` index.
          2. Did any **routed** symbol get renamed, made \`internal\`, or removed? A route naming the wrong symbol is worse than no route — it is confident, and the agent trusts it over its own reading.
          3. Does the frontmatter still parse? The \`description\` is one long unquoted YAML scalar, so a bare \`: \` inside it breaks the block and the skill stops loading (#2541).

          Consumers vendor this file and refresh it on a daily sync, so whatever is here propagates outward unreviewed.

          - Run: ${RUN_URL}"

          # The body is written inside a YAML block scalar, so every continuation line
          # carries this step's indentation. Four or more leading spaces is a markdown
          # CODE BLOCK, which would render the whole issue as unstyled preformatted text.
          BODY=$(printf '%s\n' "$BODY" | sed 's/^ \{1,10\}//')

          # Best-effort label create (idempotent). The title-based search below does
          # not depend on it, so a failure here is tolerated.
          gh label create "$LABEL" --color FBCA04 \
            --description "kuilt-primitives SKILL.md is behind the library" 2>/dev/null || true

          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Refreshing existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening new tracking issue"
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY" \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Close it when the skill catches up. Unlike publish.yml's alert — where a
      # human fixes the break and closes by hand — the condition here is fully
      # decided by two git timestamps, so leaving the issue open after it clears
      # would be pure noise. Deterministic, so it cannot churn open/closed.
      #
      # Closing is one-way: the lookup above reads `--state open` only, so a later
      # regression finds no match and opens a FRESH issue rather than reopening
      # this one. That is what the close comment has to say (#2794) — a promise to
      # reopen would send a reader watching a closed issue that will never move.
      - name: Close the tracking issue once the skill has caught up
        if: steps.check.outputs.stale == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          TITLE="kuilt-primitives skill is behind the library"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "The skill has been updated since published \`src/commonMain\` last moved — closing. If it falls behind again this job opens a NEW issue under the same title rather than reopening this one, so there is nothing to watch here. Run: ${RUN_URL}"
          fi

      # ── the per-family arm ────────────────────────────────────────────────
      # Compute and act in ONE step, unlike the arm above: the verdict is per
      # family, so splitting it would mean encoding seven verdicts (each with a
      # multi-line module list) through step outputs to gate three `if:`s that
      # would then each re-loop anyway.
      #
      # WHY THIS STEP IS GUARDED AND THE TWO ABOVE ARE NOT
      #   This arm shares nothing with the skill arm but the checkout — it derives
      #   its own module set, its own timestamps and its own verdicts, and reads no
      #   `steps.check` output. So a `gh` hiccup in either unguarded issue step
      #   above would abort the job and leave all seven families unchecked, which is
      #   precisely the outcome this arm's own per-family failure accounting exists
      #   to prevent (#2794). `!cancelled()` lets it run anyway; the job still reds,
      #   because the failed step's own status stands.
      #
      #   The two skill-arm steps must NOT get the same treatment. Both are gated on
      #   `steps.check.outputs.stale`, which only exists if `check` succeeded — so
      #   on a `check` failure there is no verdict, and opening or closing a
      #   tracking issue would be acting on one this job never reached. Skipping is
      #   the correct behaviour there, not a gap.
      #
      #   Gated on the checkout too, rather than a bare `!cancelled()`: with no
      #   working tree the `RULES` glob finds nothing and this step reports "the
      #   families moved or were deleted" — a confident, specific, wrong diagnosis
      #   of a broken runner.
      - name: Compare each family's docs against that family's own modules
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Deliberately the same budget as the arm above. A family whose docs may
          # lag longer than the skill's would be a decision worth arguing for, and
          # a second literal here is the wrong place to make it silently.
          MAX_DAYS: '7'
          LABEL: skill-stale
        run: |
          set -euo pipefail

          shopt -s nullglob
          RULES=(.claude/rules/*.md)
          if [ "${#RULES[@]}" -eq 0 ]; then
            echo "::error::no .claude/rules/*.md family files — the families moved or were deleted, and this arm would report a clean bill of health for docs it never read."
            exit 1
          fi
          echo "Checking ${#RULES[@]} families."

          # One REST listing, reused by every family below — NOT the
          # `--search "… in:title"` the arm above uses. `--search` goes through the
          # search index, which lags a just-created issue by long enough to matter,
          # and a miss here is not a no-op: it opens a SECOND issue under a title
          # that is supposed to be an idempotency key. The arm above pays that risk
          # once per run; this one would pay it seven times.
          OPEN_LIMIT=500
          gh issue list --state open --limit "$OPEN_LIMIT" --json number,title \
            > "$RUNNER_TEMP/open-issues.json"
          OPEN_COUNT=$(jq 'length' "$RUNNER_TEMP/open-issues.json")
          if [ "$OPEN_COUNT" -ge "$OPEN_LIMIT" ]; then
            echo "::error::listed $OPEN_COUNT open issues at the $OPEN_LIMIT cap, so a tracking issue beyond the cap is invisible to the lookup below and this arm would duplicate it rather than refresh it. Raise the cap."
            exit 1
          fi

          FAILED=0
          for RULE in "${RULES[@]}"; do
            FAMILY=$(basename "$RULE" .md)
            COOK="docs/agent-cookbook/$FAMILY.md"

            # The `paths:` walk `verifyFamilyRules` does, in awk: frontmatter opens
            # on line 1 and ends at the next `---`; the list is the `- "<dir>/**"`
            # lines after a bare `paths:` key, and a new top-level key ends it.
            mapfile -t DIRS < <(
              awk -v sq="'" '
                NR == 1                     { if ($0 !~ /^---[ \t]*$/) exit; next }
                /^---[ \t]*$/               { exit }
                !seen                       { if ($0 ~ /^[ \t]*paths:[ \t]*$/) seen = 1; next }
                /^[ \t]*$/ || /^[ \t]*#/    { next }
                /^[A-Za-z_][A-Za-z0-9_-]*:/ { exit }
                {
                  item = $0
                  sub(/^[ \t]*-[ \t]*/, "", item)
                  sub(/[ \t]*$/, "", item)
                  gsub(/^"|"$/, "", item)
                  gsub("^" sq "|" sq "$", "", item)
                  if (item ~ /\/\*\*$/) { sub(/\/\*\*$/, "", item); print item }
                }
              ' "$RULE"
            )
            # The ONLY disagreement with verifyFamilyRules this walk can detect. A
            # PARTIAL one — a glob dropped here but read there — leaves at least one
            # entry standing and passes silently; see the header for why that is left
            # to the Gradle guard.
            if [ "${#DIRS[@]}" -eq 0 ]; then
              echo "::error::$RULE: read zero \"<dir>/**\" globs out of its paths: frontmatter, and a family with no globs is a family this job silently stops watching. verifyFamilyRules guarantees at least one, so either this walk and that guard disagree about this file, or the file is broken in a way both would catch and this job — which runs on a schedule, outside ci-required — simply reached first. Run ./gradlew verifyFamilyRules to tell the two apart."
              exit 1
            fi

            # The silent half of this arm's scope: a module with no `src/commonMain`
            # is dropped HERE, per module, with no message — and for
            # `:kuilt-warp-runtime` that drops a published, all-targets module whose
            # whole public surface is per-target. See "WHAT THAT SCOPE DOES NOT
            # WATCH" in the header; the skill arm's identical filter is just as blind.
            PATHS=()
            for d in "${DIRS[@]}"; do
              [ -d "$d/src/commonMain" ] && PATHS+=("$d/src/commonMain")
            done
            if [ "${#PATHS[@]}" -eq 0 ]; then
              # Not an error, but note this fires only when EVERY module in the family
              # was dropped above, and the reason differs per module — so it is not
              # "a family of JVM-only modules" as such. It is honest for a family of
              # genuinely JVM/Android-only modules, which have nothing a consumer
              # imports from `commonMain`; it would NOT be for one holding a module
              # like `:kuilt-warp-runtime`, per the note above. No family reaches it
              # today. Said out loud either way, because a silently-skipped family is
              # what this job is for.
              echo "$FAMILY: none of its ${#DIRS[@]} module(s) has a src/commonMain — nothing to watch, skipping."
              continue
            fi

            # An empty path list would make `git log` report the whole repo, so the
            # guard above is load-bearing, not defensive.
            SRC_TS=$(git log -1 --format=%ct -- "${PATHS[@]}")
            DOC_TS=$(git log -1 --format=%ct -- "$RULE")
            if [ -f "$COOK" ]; then
              COOK_TS=$(git log -1 --format=%ct -- "$COOK")
              [ "$COOK_TS" -gt "$DOC_TS" ] && DOC_TS=$COOK_TS
            else
              echo "::warning::$COOK does not exist, so this family has no cookbook page for a route to land in; falling back to $RULE's own date."
            fi

            DAYS=0
            STALE=no
            if [ "$SRC_TS" -gt "$DOC_TS" ]; then
              DAYS=$(( (SRC_TS - DOC_TS) / 86400 ))
              [ "$DAYS" -gt "$MAX_DAYS" ] && STALE=yes
            fi
            echo "$FAMILY: ${#PATHS[@]} commonMain tree(s) of ${#DIRS[@]} module(s); docs=$DOC_TS src=$SRC_TS days=$DAYS stale=$STALE"

            # Distinct from the skill arm's title, which is ITS idempotency key.
            TITLE="$FAMILY agent docs are behind the library"
            EXISTING=$(
              jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' \
                "$RUNNER_TEMP/open-issues.json"
            )

            if [ "$STALE" = no ]; then
              echo "$FAMILY is current (its source is ${DAYS}d ahead of its docs; budget is ${MAX_DAYS}d)."
              if [ -n "$EXISTING" ]; then
                gh issue close "$EXISTING" \
                  --comment "\`$COOK\` or \`$RULE\` has been updated since this family's published \`src/commonMain\` last moved — closing. If it falls behind again this job opens a NEW issue under the same title rather than reopening this one, so there is nothing to watch here. Run: ${RUN_URL}" \
                  || { echo "::error::could not close #$EXISTING for $FAMILY"; FAILED=$((FAILED + 1)); }
              fi
              continue
            fi

            echo "::warning::$FAMILY: published source moved ${DAYS}d ahead of its docs"
            MOVED=$(
              git log --since="@$DOC_TS" --name-only --format= -- "${PATHS[@]}" \
                | grep -v '^$' | cut -d/ -f1 | sort -u | sed 's/^/- `:/;s/$/`/'
            )

            BODY="\`$FAMILY\`'s published \`src/commonMain\` last moved **${DAYS} days** after the newer of \`$COOK\` and \`$RULE\`. The budget is ${MAX_DAYS} days (see CLAUDE.md, \"The \`kuilt-primitives\` skill is part of the public surface\").

            Modules in this family whose published source moved since its docs did:

            ${MOVED}

            **This is a proxy, not a verdict.** The job cannot tell a new *primitive* from an internal refactor, so the answer may legitimately be \"nothing to route\" — in which case a one-line touch of \`$COOK\` is the honest way to record that someone looked.

            What to check:
            1. Did any of those modules gain a **public** primitive a consumer would otherwise hand-roll? If so it needs a section in \`$COOK\` quoting a compiled snippet, and a row pointing at it from the \`docs/agent-cookbook.md\` index. If an agent should be routed to it before it opens any file, it also needs a STOP-list route in \`.claude/skills/kuilt-primitives/SKILL.md\` — whose \`description\` is a FIXED budget, so adding a trigger there means removing one (#2662).
            2. Did any **routed** symbol get renamed, made \`internal\`, or removed? A route naming the wrong symbol is worse than no route — it is confident, and the agent trusts it over its own reading.
            3. Did a convention move? \`$RULE\` is loaded only for a session editing the paths it claims, so a rule about a module that has since changed family is loaded for nobody, and nothing says so.

            - Run: ${RUN_URL}"

            # The body is written inside a YAML block scalar, so every continuation
            # line carries this step's indentation. Four or more leading spaces is a
            # markdown CODE BLOCK, which would render the whole issue as unstyled
            # preformatted text.
            BODY=$(printf '%s\n' "$BODY" | sed 's/^ \{1,12\}//')

            if [ -n "$EXISTING" ]; then
              echo "Refreshing existing issue #$EXISTING for $FAMILY"
              gh issue comment "$EXISTING" --body "$BODY" \
                || { echo "::error::could not comment on #$EXISTING for $FAMILY"; FAILED=$((FAILED + 1)); }
            else
              echo "Opening new tracking issue for $FAMILY"
              # Best-effort label create (idempotent); the lookup above does not
              # depend on it, so a failure here is tolerated.
              gh label create "$LABEL" --color FBCA04 \
                --description "agent-facing docs are behind the library" 2>/dev/null || true
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY" \
                || gh issue create --title "$TITLE" --body "$BODY" \
                || { echo "::error::could not open a tracking issue for $FAMILY"; FAILED=$((FAILED + 1)); }
            fi
          done

          # One family's GitHub hiccup must not leave the other six unchecked, so
          # the loop records failures rather than aborting — but the job still has
          # to go red, or the hiccup is indistinguishable from a clean run.
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$FAILED family issue update(s) failed"
            exit 1
          fi
