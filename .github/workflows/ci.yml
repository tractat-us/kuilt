name: ci

# Aggregator pattern (detect → {build-jvm, build-native, detekt, dokka, …} → ci-required):
#
#   detect  →  build-jvm          ┐
#           →  build-native       │
#           →  test-result-parity │
#           →  detekt             │
#           →  dokka              ├→  ci-required (the one required check)
#           →  doc-citations      │
#           →  spike-compile      │
#           →  capability-probes  ┘
#
#           →  concurrency-probes   (runs, but NOT aggregated — see that job)
#
# detect (ubuntu, always, cheap, no JDK) classifies the change by diffing the
# changed files, emitting THREE orthogonal flags: docs-only (every path is doc-class
# → skip the heavy build), dokka-inputs (any path is a Dokka input: **/module.md,
# **/*.kt, **/commonSamples/** → run the fast Dokka module-doc check) and
# spike-inputs (any path is `:spike` Kotlin/build source → run the Apple-only spike
# compile on a macOS runner). They are independent — a module.md-only PR is docs-only
# AND dokka-inputs, so it skips the build but still MUST pass Dokka (a bad module.md
# header freezes the whole Pages deploy silently — #1061).
#
# The heavy KMP build runs only when detect says NOT docs-only, and is SPLIT
# across two jobs so the memory-heavy wasm/native codegen never co-resides with
# the JVM test forks on one 16 GB runner (see #320 / the build-job comments):
#   - build-jvm:    full `build koverXmlReport` MINUS the wasm-browser + K/N test
#                   *executions* (JVM + Android tests, lint, kover, assemble).
#   - build-native: ONLY the wasm + macOS + iOS-sim test executions (wasm-opt /
#                   Binaryen / Karma-Chrome / K/N test exes), with no JVM forks.
# Their task graphs union to exactly the old single `build koverXmlReport` graph
# (proven by --dry-run set-diff), so no platform loses coverage.
#
# ci-required (if: !cancelled()) is the SOLE required status check that branch
# protection looks for. It passes when detect + both build jobs + detekt all
# succeed OR when the heavy jobs were legitimately skipped (docs-only), AND the
# Dokka check passed whenever the change touched Dokka inputs, AND the spike
# compile passed whenever the change touched `:spike` sources; it fails when any
# required job failed/cancelled. This lets pure guide/prose docs-only PRs merge
# immediately without a build, while code PRs — and any PR touching a module.md /
# KDoc / spike source — still gate on the relevant checks. Publishing stays
# separate (publish.yml).
#
# APPLE COVERAGE — deliberately asymmetric, and the asymmetry is the design.
# The per-PR lane is Linux-only because the cinterop-bearing Apple targets need a
# Mac host, and GitHub caps a plan at FIVE concurrent macOS jobs (a hard
# concurrency ceiling, not a cost one — this repo is public, so standard hosted
# runners are free at every size). This workflow fires ~25 runs/hour, and the
# nightly Apple job takes ~11.5 min, so an unconditional macOS job would saturate
# that 5-job cap and queue every PR behind it. The shipped library's own Apple K/N
# test executions therefore run out of band in apple-nightly.yml, NOT here (see
# that file's header, and #933). `spike-compile` is the one macOS job in this lane
# and it is PATH-FILTERED to `:spike` sources precisely so it does not put a macOS
# runner on every PR. The complementary half — a change to :kuilt-core/:kuilt-session/
# :kuilt-nw that breaks :spike without touching spike/ — is caught by the same
# apple-nightly lane, which files a tracking issue on failure (#1796).

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review so draft→ready transitions trigger a build (stack-draft
    # convention: only the bottom + top of a stack are out of draft).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# The group discriminator (…-ready vs …-push) exists to survive the draft→ready
# cancel race (#1132). When a worker pushes its final commit AND readies a PR
# within the same second, two pull_request runs fire on the SAME head sha: a
# synchronize (draft==true, fast SKIPPED→FAILURE) and a ready_for_review
# (draft==false, real build). With a single shared group + cancel-in-progress,
# the later-starting synchronize run cancels the in-flight ready_for_review run,
# leaving the fast draft FAILURE authoritative forever with no event to supersede
# it. Splitting ready_for_review into its own …-ready group means a racing
# synchronize (…-push group) can NEVER cancel the ready build — it always
# completes and its ci-required check run supersedes the draft's on the same sha.
# Rapid successive pushes still cancel each other (both in the …-push group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'ready_for_review' && 'ready' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ── detect ───────────────────────────────────────────────────────────────
  # Always runs (except on draft PRs). Emits docs-only=true when every changed
  # path is a doc (*.md, docs/**, or Writerside/** — the Writerside guide source,
  # incl. its non-.md .tree/.cfg/.list files). Cheap: hosted runner, no JDK, no Gradle.
  detect:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      dokka-inputs: ${{ steps.classify.outputs.dokka-inputs }}
      spike-inputs: ${{ steps.classify.outputs.spike-inputs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Classify change (docs-only? Dokka inputs? spike inputs?)
        id: classify
        # Emits THREE orthogonal flags:
        #   docs-only    — every changed path is doc-class (*.md / docs/** / Writerside/**);
        #                  the heavy KMP build is skipped.
        #   dokka-inputs — any changed path is a Dokka INPUT (**/module.md, **/*.kt,
        #                  **/commonSamples/**); the fast Dokka module-doc check runs.
        #   spike-inputs — any changed path is `:spike` Gradle-compiled source
        #                  (spike/src/** or spike/build.gradle.kts); the Apple-only
        #                  spike compile runs on a macOS runner (#1796).
        # They are independent: a module.md-only PR is docs-only=true AND
        # dokka-inputs=true — it skips the build but MUST still pass Dokka, because a
        # bad module.md header silently freezes the whole Pages deploy (#1061).
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD 2>/dev/null || echo "")
              ;;
            push)
              BEFORE="${{ github.event.before }}"
              if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
                echo "Initial push — treating as not docs-only, run Dokka + spike compile."
                { echo "docs-only=false"; echo "dokka-inputs=true"; echo "spike-inputs=true"; } >> "$GITHUB_OUTPUT"; exit 0
              fi
              FILES=$(git diff --name-only "$BEFORE" "${{ github.event.after }}" 2>/dev/null || echo "")
              ;;
            *)
              echo "${{ github.event_name }} — treating as not docs-only, run Dokka + spike compile."
              { echo "docs-only=false"; echo "dokka-inputs=true"; echo "spike-inputs=true"; } >> "$GITHUB_OUTPUT"; exit 0
              ;;
          esac

          if [ -z "$FILES" ]; then
            echo "No changed files detected — treating as not docs-only, no Dokka/spike inputs."
            { echo "docs-only=false"; echo "dokka-inputs=false"; echo "spike-inputs=false"; } >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Changed files:"; echo "$FILES"

          DOCS_ONLY=true
          DOKKA_INPUTS=false
          SPIKE_INPUTS=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # docs-only holds only while every file is doc-class.
            if ! { [[ "$file" == *.md ]] || [[ "$file" == docs/* ]] || [[ "$file" == Writerside/* ]]; }; then
              DOCS_ONLY=false
            fi
            # dokka-inputs trips on any module.md, any Kotlin source, or a doc sample.
            if [[ "$file" == module.md ]] || [[ "$file" == */module.md ]] \
              || [[ "$file" == *.kt ]] || [[ "$file" == *commonSamples/* ]]; then
              DOKKA_INPUTS=true
            fi
            # spike-inputs trips ONLY on what Gradle actually compiles for `:spike`:
            # its Kotlin sources and its build script. Deliberately NOT spike/app/**
            # (the Xcode project — never built by Gradle, needs signing), and not
            # spike/*.md or spike/*.sh. Narrow on purpose: this flag is the ONLY thing
            # keeping a macOS runner off every PR, and macOS runners are capped at 5
            # concurrent jobs plan-wide (#1796).
            if [[ "$file" == spike/src/* ]] || [[ "$file" == spike/build.gradle.kts ]]; then
              SPIKE_INPUTS=true
            fi
          done <<< "$FILES"

          [ "$DOCS_ONLY" = true ] && echo "::notice::All changes are docs-class — skipping the build."
          [ "$DOKKA_INPUTS" = true ] && echo "::notice::Change touches Dokka inputs — running the Dokka module-doc check."
          [ "$SPIKE_INPUTS" = true ] && echo "::notice::Change touches :spike sources — running the Apple spike compile."
          { echo "docs-only=$DOCS_ONLY"; echo "dokka-inputs=$DOKKA_INPUTS"; echo "spike-inputs=$SPIKE_INPUTS"; } >> "$GITHUB_OUTPUT"

  # ── build-jvm ──────────────────────────────────────────────────────────────
  # The JVM/Android half of the build: full `build koverXmlReport` with the
  # wasm-browser + Kotlin/Native test *executions* excluded. This still runs the
  # whole compile/assemble graph (all platforms' main compile incl.
  # compileKotlinIosArm64, the Android AAR, the wasmJs jar), Android lint, JVM +
  # Android unit tests, and the kover report + verify. It drops only the
  # wasm-opt/Karma-Chrome and K/N test-executable runs — those move to
  # build-native so they never co-reside with the forked JVM test JVMs (the
  # documented OOM cause; see #320 and the daemon-heap note below). Skipped on
  # docs-only.
  build-jvm:
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # 45, not 30: a PR touching :kuilt-crdt or :kuilt-otel invalidates lintAnalyzeDebug across the
    # whole downstream cone, so it executes everywhere instead of serving FROM-CACHE — and each
    # execution emits the metadata errors tracked in #2172. Three PRs in the #2127 series were
    # cancelled at ~30m for this and went green on a re-run of identical code. This buys headroom;
    # it does not reduce the cost. #2191 is the reduction work.
    timeout-minutes: 45
    env:
      # Shared S3 build cache (Fly Tigris). Read on every build; pushed only from
      # main (gated in settings.gradle.kts). Absent ⇒ off. Build scans auto-publish
      # because GitHub Actions always sets CI=true.
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      # Kotlin/Native toolchain + dependencies. setup-gradle caches ~/.gradle but
      # not ~/.konan, so without this every run re-downloads konan and recompiles
      # the native targets cold. build-jvm still compiles the native main sources
      # (via assemble/build), so it needs the toolchain too. Keyed on the
      # toolchain-defining files; shared key with build-native (same cache).
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Start jstack heartbeat
        # Background watchdog: dump thread stacks for every live GradleWorkerMain /
        # java process into build/jstack-dumps/, AND distil the forked test JVM's
        # "Test worker" stack into a one-glance build/jstack-dumps/jstack-summary.txt.
        # Dumps are written eagerly to disk so they survive a job cancellation or
        # timeout kill. Killed by the next step on success; on hang/timeout the dumps
        # are uploaded by "Upload test reports" (if: always()). Combined with
        # kotlinx.coroutines.debug (set in build.gradle.kts) the dump shows coroutine
        # names + creation sites — the hung runTest frame is immediately identifiable.
        #
        # Cadence: first dump at 90s (a test killed by a tight per-test timeout dies
        # before the old 300s cadence ever fired), then a steady 120s cadence so a
        # fresh dump always landed within the last ~2 min before the 15-min per-Test
        # task timeout (build.gradle.kts) kills the forked JVM — the last-gasp dump is
        # the most valuable, and the task timeout fires at an unknown job-relative
        # second, so a bounded steady cadence is the only robust way to always have one.
        #
        # jstack-summary.txt: per dump, the forked test JVM's "Test worker" thread —
        # header, state, and top ~25 non-JDK frames (the ones that name the test + the
        # spinning library call). Only the forked test JVM has that thread, so this
        # de-noises a 4-JVM dump down to the stack that matters. The last entry is the
        # most recent (the last-gasp). See #329, #891, and PR #902 (a Quilter.onFullState
        # anti-entropy storm found this way — but only after hand-digging "Test worker"
        # out of the raw dump; this summary makes the next one a single glance).
        # Backgrounded + self-guarded (|| true, no set -e escape) so it never fails the job.
        run: |
          mkdir -p build/jstack-dumps
          SUMMARY="build/jstack-dumps/jstack-summary.txt"

          summarize() {
            dump="$1"; stamp="$2"
            awk -v stamp="$stamp" '
              /^"Test worker/ { blk=1; n=0; print "=== Test worker @ " stamp " (" FILENAME ") ==="; print; next }
              blk && /^[[:space:]]*$/ { blk=0; print ""; next }
              blk {
                if ($0 ~ /Thread\.State/) { print; next }
                if ($0 ~ /^[[:space:]]*at (java\.|jdk\.|sun\.)/) next
                if ($0 ~ /^[[:space:]]*at / && n++ < 25) print
              }
            ' "$dump" >> "$SUMMARY" 2>/dev/null || true
          }

          dump_once() {
            stamp=$(date +%Y%m%dT%H%M%S)
            dump="build/jstack-dumps/jstack-${stamp}.txt"
            echo "=== jstack heartbeat ${stamp} ===" >> "$dump"
            pids=$(jps -l 2>/dev/null | grep -i 'GradleWorkerMain\|gradle\|java' | awk '{print $1}' || true)
            if [ -n "$pids" ]; then
              for pid in $pids; do
                echo "--- PID $pid ---" >> "$dump"
                jstack "$pid" >> "$dump" 2>&1 || echo "(jstack failed for PID $pid)" >> "$dump"
              done
            else
              echo "(no matching Java processes found)" >> "$dump"
            fi
            summarize "$dump" "$stamp"
          }

          (
            sleep 90
            dump_once || true
            while true; do
              sleep 120
              dump_once || true
            done
          ) &
          echo "JSTACK_PID=$!" >> "$GITHUB_ENV"

      - name: Build, lint, JVM/Android tests + coverage
        # Two coordinated levers keep peak memory inside the 16 GB runner.
        #
        # 1. --max-workers=2 caps the *additive* peak — concurrent Gradle worker
        #    processes (forked test JVMs, some compile/native workers). Below the
        #    runner's 4 CPUs.
        #
        # 2. CI-only daemon-heap caps (-Dorg.gradle.jvmargs / -Dkotlin.daemon.jvmargs
        #    below) cap the *dominant* floor. gradle.properties keeps -Xmx4g each
        #    for local dev (fine on a workstation), but on the 16 GB runner the two
        #    long-lived daemons (Gradle + Kotlin) reserve 8 GB of heap that stays
        #    resident regardless of --max-workers. On a COLD build (a catalog or
        #    build-logic change busts every module's cache) those daemon heaps are
        #    at their high-water mark from compilation. Capping each daemon to 3 GB
        #    drops the floor to 6 GB. Verified by a controlled experiment: two
        #    -Xmx4g JVMs that commit their heaps are OOM-killed in a 7 GB cgroup
        #    every run, while -Xmx3g/-Xmx2g pairs survive; a full cold build at
        #    3 GB/3 GB completes with no OutOfMemoryError, same wall time as 4 GB.
        #
        # The structural fix for #320 is the job split itself: excluding the
        # wasm-browser + K/N test *executions* (-x below) removes the Binaryen
        # wasm-opt + Karma headless-Chrome + native test-executable burst that
        # used to fire concurrently with these forked JVM test JVMs and tip the
        # committed footprint over 16 GB. That burst now runs alone in
        # build-native. The 3 GB cap is retained conservatively — this job still
        # compiles the native main sources alongside the JVM forks; relaxing back
        # toward 4 GB can follow once the split is proven over several cold builds.
        #
        # koverXmlReport rides on the same invocation so the JVM test tasks it
        # depends on run once: build executes them, then the report aggregates
        # the coverage data into build/reports/kover/report.xml (collected as an
        # artifact below; no external coverage service). koverVerify runs via
        # `build` and gates the coverage thresholds.
        run: >-
          ./gradlew build koverXmlReport --max-workers=2
          -x wasmJsTest -x wasmJsBrowserTest -x macosArm64Test -x iosSimulatorArm64Test
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      - name: Kill jstack heartbeat
        # Stop the background watchdog. Runs if: always() so the orphaned loop is
        # cleaned up even when the build step fails.
        if: always()
        run: |
          if [ -n "${JSTACK_PID:-}" ]; then
            kill "$JSTACK_PID" 2>/dev/null || true
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/kover/
            build/jstack-dumps/

  # ── build-native ─────────────────────────────────────────────────────────
  # The wasm/native half of the build: ONLY the wasm + macOS + iOS-sim test
  # *executions*. Each task pulls in its own platform compile transitively, so
  # this job runs the Binaryen wasm-opt + Karma headless-Chrome (wasmJsBrowserTest)
  # and the Kotlin/Native test executables — the memory-heavy codegen burst —
  # with NO forked JVM test JVMs sharing the box. Combined with build-jvm's task
  # graph this is exactly the old single `build koverXmlReport` graph (proven by
  # --dry-run set-diff: union is identical, zero tasks dropped). Skipped on
  # docs-only.
  build-native:
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Start jstack heartbeat
        # Same background watchdog as build-jvm — kept in lockstep (see #329, #891).
        # First dump at 90s, then a steady 120s cadence so a fresh dump always landed
        # within the last ~2 min before the 15-min per-Test task timeout kills a hung
        # K/N test or wasm-browser run, even on a timeout kill. jstack-summary.txt
        # distils the forked test JVM's "Test worker" stack (top non-JDK frames) to a
        # one-glance read; the Gradle orchestrating JVM is still captured in full for
        # K/N / wasm hangs that don't run on a JVM "Test worker" thread.
        # Self-guarded (|| true) so it never fails the job.
        run: |
          mkdir -p build/jstack-dumps
          SUMMARY="build/jstack-dumps/jstack-summary.txt"

          summarize() {
            dump="$1"; stamp="$2"
            awk -v stamp="$stamp" '
              /^"Test worker/ { blk=1; n=0; print "=== Test worker @ " stamp " (" FILENAME ") ==="; print; next }
              blk && /^[[:space:]]*$/ { blk=0; print ""; next }
              blk {
                if ($0 ~ /Thread\.State/) { print; next }
                if ($0 ~ /^[[:space:]]*at (java\.|jdk\.|sun\.)/) next
                if ($0 ~ /^[[:space:]]*at / && n++ < 25) print
              }
            ' "$dump" >> "$SUMMARY" 2>/dev/null || true
          }

          dump_once() {
            stamp=$(date +%Y%m%dT%H%M%S)
            dump="build/jstack-dumps/jstack-${stamp}.txt"
            echo "=== jstack heartbeat ${stamp} ===" >> "$dump"
            pids=$(jps -l 2>/dev/null | grep -i 'GradleWorkerMain\|gradle\|java' | awk '{print $1}' || true)
            if [ -n "$pids" ]; then
              for pid in $pids; do
                echo "--- PID $pid ---" >> "$dump"
                jstack "$pid" >> "$dump" 2>&1 || echo "(jstack failed for PID $pid)" >> "$dump"
              done
            else
              echo "(no matching Java processes found)" >> "$dump"
            fi
            summarize "$dump" "$stamp"
          }

          (
            sleep 90
            dump_once || true
            while true; do
              sleep 120
              dump_once || true
            done
          ) &
          echo "JSTACK_PID=$!" >> "$GITHUB_ENV"

      - name: Log system resources before wasm tests
        # Snapshot memory + CPU before the Karma/Chrome burst so a resource-contention
        # disconnect (OOM-killed Chrome, swap thrash, CPU starvation) is distinguishable
        # from a slow test. Printed to the step log — no artifact needed.
        run: |
          echo "=== memory ===" && free -h
          echo "=== cpus ===" && nproc
          echo "=== disk ===" && df -h /
          echo "=== load ===" && uptime

      - name: wasm + native tests
        # wasmJsTest (incl. wasmJsBrowserTest — Binaryen wasm-opt + Karma Chrome),
        # macosArm64Test and iosSimulatorArm64Test cover every non-JVM/Android test
        # target. No JVM test forks run here, so the heavy codegen burst has the
        # whole 16 GB to itself. Same --max-workers=2 + 3 GB daemon caps as build-jvm
        # for parity and conservative headroom; this job has no JVM forks, so the
        # caps can likely relax once the split is proven, but stay conservative now.
        run: >-
          ./gradlew wasmJsTest macosArm64Test iosSimulatorArm64Test --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

      - name: Kill jstack heartbeat
        if: always()
        run: |
          if [ -n "${JSTACK_PID:-}" ]; then
            kill "$JSTACK_PID" 2>/dev/null || true
          fi

      - name: Collect OOM evidence on failure
        # On a disconnect that looks resource-driven, the kernel OOM-killer logs the
        # victim process (Chrome/java). Captured here and uploaded with the artifact.
        if: failure()
        run: |
          mkdir -p build/jstack-dumps
          echo "=== dmesg OOM / killed-process lines ===" >> build/jstack-dumps/oom-evidence.txt
          dmesg 2>/dev/null | grep -iE 'killed process|oom.kill|out of memory|memory cgroup' \
            >> build/jstack-dumps/oom-evidence.txt || echo "(no OOM lines found)" \
            >> build/jstack-dumps/oom-evidence.txt
          echo "=== memory at failure ===" >> build/jstack-dumps/oom-evidence.txt
          free -h >> build/jstack-dumps/oom-evidence.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-native
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/karma-config.d/
            build/jstack-dumps/

  # ── detekt ───────────────────────────────────────────────────────────────
  # Static analysis: null-safety rules on main sources + production-dispatcher
  # ban on test sources. Runs as its OWN job, parallel to the build jobs, so
  # detekt's type-resolution analysis doesn't share a runner — and its memory —
  # with the build's wasmJs-browser + test tasks. Skipped on docs-only.
  detekt:
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      # detekt's Android-library configuration needs the SDK; it analyzes only
      # commonMain + jvmMain, so no Kotlin/Native toolchain is required.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run detekt (null-safety rules)
        run: ./gradlew detektAll --max-workers=4

  # ── dokka ──────────────────────────────────────────────────────────────────
  # Fast per-module Dokka module-doc build. Runs whenever a change touches a Dokka
  # INPUT — any module.md, any *.kt (KDoc), or a commonSamples doc sample — EVEN on
  # an otherwise docs-only PR that the heavy build skips. This is the only reliable
  # detector for the intellij-markdown/Dokka "Wrong AST Tree" break a bad module.md
  # header trips: it can't be linted, only run. Without this gate a module.md-only
  # PR classifies docs-only, merges green, and freezes the ENTIRE published Pages
  # site (the Writerside guide included) because docs.yml's single deploy needs both
  # the Dokka and the Writerside surfaces. Scoped to Dokka inputs so guide/prose-only
  # docs PRs stay on the fast path. dokkaGenerateModuleHtml is the per-module HTML
  # task (seconds — no full-site aggregation) that still parses every module.md +
  # KDoc, so it fails on exactly the input class that freezes the deploy. See #1061.
  dokka:
    needs: detect
    if: needs.detect.outputs.dokka-inputs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      # Dokka analyses every target's main sources (incl. the native source sets),
      # so it needs the Kotlin/Native toolchain — same konan cache as the build jobs.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Dokka module-doc build (parses every module.md + KDoc)
        # Aggregate per-module task: runs :<module>:dokkaGenerateModuleHtml for every
        # subproject, so a broken module.md in ANY module fails the check. Deliberately
        # NOT the full-site `dokkaGenerate` (which also runs the cross-module link/merge
        # pass) — the module-doc build is what parses module.md + KDoc and is far faster.
        run: ./gradlew dokkaGenerateModuleHtml --max-workers=2

  # ── doc-citations ───────────────────────────────────────────────────────────
  # The docs-integrity guards, all of which are pure file-reading Gradle tasks:
  #   - verifyDocCitations — every `<!-- verbatim from <path>#<symbol> -->` still matches the
  #     source it names, and no citation dangles off a renamed/deleted symbol (#1792);
  #   - verifySampleLinks  — every `@sample` KDoc tag still names a sample Dokka can resolve
  #     (#2259). Tags live in KDoc AND in `module.md`, and a module.md-only PR is docs-only.
  #   - verifyModuleTable  — every `:kuilt-*` module still has a row in CLAUDE.md's module table
  #     (#2257). CLAUDE.md is `*.md`, so DELETING a row is a docs-only change; only the other
  #     direction (adding a module) touches `settings.gradle.kts` and reaches the heavy build.
  #   - verifySeamHarnessCoverage — every production `Seam` implementation still has a row in
  #     `docs/seam-harness-coverage.md`, against a conformance harness or a written opt-out
  #     (#1871). Same asymmetry as the module table, and the reason it belongs in this job:
  #     deleting a row — or gutting the reason that makes an opt-out visible — is a `*.md` edit
  #     and therefore docs-only, so `check`-wiring alone would never see the one direction a
  #     person is most likely to take when a row is in their way.
  #
  # ORTHOGONAL to docs-only, for exactly the reason the Dokka gate is: the likeliest way to
  # drift a citation — or to break the `@sample` in a module.md, or to drop a module table row —
  # is a docs-only PR, and that path skips build-jvm/build-native entirely. All four tasks are
  # wired into `check` (so `./gradlew build` covers them on any code change), but `check`-wiring
  # ALONE would never fire on the very class of change most likely to break them. Cheap enough to
  # always run: no compilation and no Kotlin/Native toolchain, just file-reading verification tasks.
  # ── test-result-parity ──────────────────────────────────────────────────────
  # The one place a JVM result and a wasm result exist on the same machine (#2185).
  #
  # `verifyTestResultParity` compares, per module, which commonTest classes produced results on
  # each target — a class present on one and silently absent from another is the quiet form of
  # #2183's message-size ceiling, where the harness drops a class's results and exits 0. But the
  # comparison needs both halves of the matrix, and the job split above puts them on two runners:
  # build-jvm excludes every wasm/native test execution, and build-native never invokes `check`.
  # Wiring the task into `check` alone therefore leaves it comparing JVM against Android in one
  # job and nothing at all in the other — green by construction, on the very pairing #2185 is
  # about.
  #
  # Both jobs already upload `**/build/test-results/` with paths preserved, so downloading both
  # artifacts over a fresh checkout reconstitutes exactly the tree a single-runner build would
  # have left, and the task runs unchanged. Cheap: no compilation, no Kotlin/Native toolchain.
  test-result-parity:
    needs: [detect, build-jvm, build-native]
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      # Configuring the Android library modules needs an SDK even though nothing is built.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Into the checkout root: the artifacts carry `<module>/build/test-results/<task>/…`, and the
      # two jobs' task directories are disjoint, so they merge rather than collide.
      - name: Download JVM/Android test results
        uses: actions/download-artifact@v7
        with:
          name: test-reports-jvm
          path: .

      - name: Download wasm/native test results
        uses: actions/download-artifact@v7
        with:
          name: test-reports-native
          path: .

      - name: Verify no target silently dropped a commonTest class
        run: ./gradlew verifyTestResultParity

  doc-citations:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Read-only cache: this job compiles nothing, so it has no build output worth
      # publishing and should not contend with the heavy jobs' cache writes.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      # Configuring the Android library modules needs an SDK even though nothing is built.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify doc citations, @sample links, the module table and seam harness coverage
        run: ./gradlew verifyDocCitations verifySampleLinks verifyModuleTable verifySeamHarnessCoverage

  # ── capability-probes ───────────────────────────────────────────────────────
  # The GATING half of the probe split (#1768's option 2). Runs only the
  # DETERMINISTIC real-threaded probes — those whose guarded defect reproduces
  # reliably rather than under contention — and IS in ci-required's needs +
  # success clauses, so a red here blocks the merge. Everything else about the
  # setup mirrors concurrency-probes below (dedicated runner, no sibling test
  # forks, same -P un-gate, same docs-only guard).
  #
  # Scoped by NAME CONTRACT, not an enumeration: `*CapabilityConcurrencyTest`.
  # The sibling job's header records why — an enumeration went stale as probes
  # were added, so the class name is the contract and a new deterministic probe
  # opts into the gate by being named for it.
  #
  # Determinism is the entrance fee, and each member carries its receipt here.
  # A red in this job is a real defect essentially every time; that is the whole
  # reason it may gate. Today it matches two classes:
  #
  #   - CompositeCapabilityConcurrencyTest (#1767) — a lost-update race in
  #     CompositeSeam's capability rollup: two recomputes interleave and a stale
  #     confident `Available` lands last with no later emission to correct it.
  #     Reverting the fix does not make the probe flaky — it hangs RELIABLY
  #     (observed at round=842). Its failure class is exactly the one #1712
  #     exists to eliminate (a peer confidently asserting a network state it
  #     never observed).
  #   - ScopedCloseableCloseOnceCapabilityConcurrencyTest (#2305) — a
  #     check-then-set close guard in ScopedCloseable, the base class of ten
  #     multi-threaded coordinators, letting two concurrent close() callers both
  #     run onClose() against its at-most-once contract. On the unguarded flag it
  #     reddens at 1336–1830 of 2000 rounds, worst count 8 of 8, in ~1 s per run.
  #
  # Keep this list current when a class opts in: it is the load-bearing
  # justification for letting this job block merges at all, and a stale one tells
  # an auditor something untrue about the gate itself.
  #
  # DELIBERATE OVERLAP: concurrency-probes still runs `*ConcurrencyTest`, which
  # includes this probe, so it executes twice per run. That costs seconds and
  # keeps the non-blocking signal complete (one artifact covering every probe).
  # Do NOT "optimise" it away by excluding the capability test from that job.
  capability-probes:
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run deterministic capability probes (isolated runner, GATING)
        # -Pconcurrency.stress.tests=true drops the build-defined `*ConcurrencyTest`
        # exclusion (kuilt-core/build.gradle.kts); the narrower --tests include then
        # selects only the deterministic capability probes. The -P flag is required
        # for the include to match at all — a build-defined exclude would otherwise
        # win over a command-line include and this job would be green-by-vacuity.
        run: >-
          ./gradlew :kuilt-core:jvmTest -Pconcurrency.stress.tests=true
          --tests "*CapabilityConcurrencyTest"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-capability-probes
          path: |
            kuilt-core/build/reports/tests/
            kuilt-core/build/test-results/

  # ── concurrency-probes ──────────────────────────────────────────────────────
  # Every `*ConcurrencyTest` in kuilt-core is a real-threaded probe (the name is the
  # contract — deliberately not an enumeration here, which is what went stale as
  # probes were added). They run on real threads, not
  # virtual time, so they are starved when other test JVMs saturate the box (the
  # #1135 hang — root-caused as OS-CPU contention, not a code defect; see #1158).
  # They are -P-gated OUT of the normal build (kuilt-core/build.gradle.kts) and run
  # here ALONE on a dedicated runner with no sibling test forks, so they finish in
  # seconds. Mirrors build-jvm's setup + docs-only guard.
  #
  # STILL INTENTIONALLY NOT in ci-required's needs/aggregation. #1768's option 2
  # split the probes: the deterministic ones now gate via capability-probes above,
  # and THIS job — which still runs everything, including the capability probe —
  # stays non-blocking for the contention/wedge-sensitive ones. A starved probe
  # must never wedge the merge gate (#1158); the #1151 mitigation (5-min cap +
  # thread dump) stays as the in-test backstop.
  #
  # WHY THIS HALF IS STILL NOT GATING. Over the last 500 ci.yml runs
  # (2026-07-23 → 07-28, 485 with this job resolved) there were 10 runs where this
  # job FAILED while ci-required SUCCEEDED — i.e. 10 merges that gating would have
  # blocked, 7 of them pull_request runs, 3.8% of the 266 otherwise-green runs. All
  # 10 were the same test,
  # CompositeSeamCloseTornConcurrencyTest.closePublishesTerminalTornEvenWhenPliesAreChurning,
  # failing at ConcurrencyStressHarness.kt:56 — the 5-minute harness cap, with the
  # artifact showing every DefaultDispatcher worker parked in tryPark. QUIESCENT,
  # not CPU-starved: #1784 (CompositeSeam.peers wedging permanently), reproducing
  # on main. That is the entire pre-fix failure cluster — one test, one bug.
  #
  # #1784 CLOSED 2026-07-28T04:12Z, i.e. INSIDE that window, so the 3.8% above is
  # almost entirely a pre-fix number. Re-measured on post-fix data only —
  # 2026-07-28T04:12Z → 2026-07-31T08:45Z, 111 completed ci.yml runs (~3.2 days,
  # not a quiet pocket: 53 runs on 07-28, 9 on 07-29, 38 on 07-30, 11 on 07-31):
  #   - runs where this job FAILED while ci-required SUCCEEDED: 0
  #   - probe-job failures of any kind: 19 — ALL on two Renovate dependency
  #     branches (renovate/gradle-9.x, renovate/vanniktechmavenpublish), every one
  #     also failing ci-required, and every one dying at
  #     :build-logic:generatePrecompiledScriptPluginAccessors without reaching a
  #     test. So: zero probe TEST failures in the window.
  # Suggestive, not conclusive — that is only 64 otherwise-green runs against 266
  # before, and P(0 | n=64, p=0.038) ≈ 8.4%. Roughly double the otherwise-green
  # runs would push it under 1%. Both measurements are kept because the newer one
  # is only readable against the older baseline.
  #
  # NB on method: a survey of the last 100 runs showed ZERO such runs and was
  # MISLEADING — 100 runs is ~4 hours here, and that window happened to fall in a
  # quiet pocket just after the cluster. A survey's window is part of its claim;
  # quote the time span, not just the sample count. That is why both windows above
  # are stated as time spans, and why the post-fix one is anchored causally (to
  # #1784's fix) rather than to an arbitrary run count.
  #
  # GRADUATING TO #1768's OPTION 3 — folding this job into the gate too — is then a
  # one-line change (add it to ci-required's needs + success clauses, exactly as
  # capability-probes is wired). Do it once the post-#1784 sample matures, and
  # RE-MEASURE the lone-failure rate over a stated window rather than assuming the
  # 0/64 above has held.
  concurrency-probes:
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run real-threaded concurrency probes (isolated runner, NON-BLOCKING)
        # -Pconcurrency.stress.tests=true un-gates the *ConcurrencyTest classes
        # (excluded from the normal run in kuilt-core/build.gradle.kts); --tests scopes
        # the JVM test task to exactly them so nothing else co-schedules on this runner.
        # The count is deliberately not stated — the name is the contract (see header).
        run: >-
          ./gradlew :kuilt-core:jvmTest -Pconcurrency.stress.tests=true
          --tests "*ConcurrencyTest"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-concurrency-probes
          path: |
            kuilt-core/build/reports/tests/
            kuilt-core/build/test-results/

  # ── nw-concurrency-probes ───────────────────────────────────────────────────
  # `:kuilt-nw`'s real-threaded probes (#2481). Same shape as concurrency-probes
  # above — dedicated runner, no sibling test forks, the same -P un-gate, the same
  # docs-only guard — and, like it, **NOT** in ci-required's needs/aggregation.
  #
  # NON-GATING FIRST, deliberately. #1768's split says the entrance fee for the
  # gate is a determinism receipt, and this lane is new: it has no failure history
  # here at all, and the argument for letting a job block merges has to be made
  # from observed behaviour on this runner rather than from a local measurement on
  # a workstation. Graduating it to capability-probes is a one-line change (add it
  # to ci-required's needs + success clauses) once a stated window of runs shows a
  # lone-failure rate near zero — measure it and quote the time span, not just a
  # sample count, for the reason concurrency-probes' own header records.
  #
  # ROUND COUNT, recorded here as capability-probes demands of its members.
  # `:kuilt-nw` ships TWO probes, and neither subsumes the other:
  #
  #   - NwSeamConcurrencyTest.broadcastNeverLeaksARaceExceptionWhilePeersAreEvicted
  #     — `broadcast` snapshots `registry` (and increments the chosen link's
  #     outbound counter) in one critical section while `connectionClosedLoop` and
  #     `reconcileStates` evict out of the same map. 80 rounds; each round is a
  #     6-node star, 4 broadcasters × 200 sends, 5 staggered departures.
  #     RECEIPT: with the `lock.withLock` around `broadcast`'s target snapshot
  #     deleted, it fails 6 of 6 consecutive runs with a
  #     ConcurrentModificationException raised out of `broadcast`. Restored: green.
  #
  #   - NwSeamConcurrencyTest.noLifecycleCollectorLeaksARaceWhileTheRegistryChurns
  #     (#2481) — the COLLECTOR-side half. The probe above catches on the caller's
  #     own call, so it can only see the two critical sections a caller enters; a
  #     race in any of the seam's seven collectors is raised on a coroutine nobody
  #     awaits, killing that loop while the seam still looks healthy. This one
  #     records every escape via a CoroutineExceptionHandler on each node's scope,
  #     and samples the `registry`/`conns` binding invariant mid-flight for the
  #     failures that corrupt without throwing. 60 rounds; each round is a 6-node
  #     star, 8 redials per peer 3 ms apart (every one drives the dedup), 2
  #     broadcasters, a 1 ms watchdog. ~2.6 s.
  #     RECEIPT (deleting one `lock.withLock` per row; churn probe / broadcast
  #     probe): connectionClosedLoop 3/3 / 3/3 · removeByConn 3/3 / 3/3 ·
  #     processFrame's classify section 2/3 / 0/3 · sweepInboundSilence 5/11 / 0/5.
  #     GREEN rows, stated because they are the informative half: reconcileStates
  #     0/3, latchTorn 0/3, close's teardown 0/3 are pinned by NEITHER probe, and
  #     `broadcast`'s own snapshot is 0/3 here (this probe's caller-side load is
  #     deliberately light — the row belongs to its sibling).
  #     The sweepInboundSilence rate is LOAD-DEPENDENT: 3/3 at box load ~60-69 on
  #     16 cores, 0/2 at ~24, 2/6 at ~16-18. Same direction as #2466. Quote the
  #     load beside any re-measurement; a quiet-box green carries no information.
  #     It ships anyway because three OTHER rows red 3/3 — but that row alone would
  #     not have earned it.
  #     The probe prints `nw-probe.rig-receipt …` on every run (links opened,
  #     dial/send overlaps, mutations observed under load, audit samples) so a green
  #     leaves its own rig numbers in this job's artifact rather than only a pass.
  #
  # The three other hazards #2481 named are deliberately NOT here, and the class
  # KDoc carries the measurements: each asks a collector to race itself, and every
  # NwSeam collector is a single coroutine, so deleting their guards leaves a probe
  # green (5/5, 0/6, 0/6). A probe that cannot be made to red is green by absence.
  # Do not "restore coverage" by adding them back without a fresh receipt.
  nw-concurrency-probes:
    needs: detect
    if: needs.detect.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      # Configuring :kuilt-nw's Android library variant needs an SDK.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run :kuilt-nw concurrency probes (isolated runner, NON-BLOCKING)
        # -Pconcurrency.stress.tests=true drops the build-defined `*ConcurrencyTest`
        # exclusion (kuilt-nw/build.gradle.kts); --tests then scopes the JVM test task
        # to exactly them. The -P flag is required for the include to match at all — a
        # build-defined exclude wins over a command-line include, so without it this
        # job would be green by vacuity.
        run: >-
          ./gradlew :kuilt-nw:jvmTest -Pconcurrency.stress.tests=true
          --tests "*ConcurrencyTest"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-nw-concurrency-probes
          path: |
            kuilt-nw/build/reports/tests/
            kuilt-nw/build/test-results/

  # ── spike-compile ───────────────────────────────────────────────────────────
  # Compiles `:spike` — the two-iPhone hardware-validation harness — for its Apple
  # targets. THE ONLY macOS job in the per-PR lane, and path-filtered so it stays
  # that way (#1796).
  #
  # WHY IT WAS INVISIBLE. `:spike` is excluded from the root Gradle graph unless
  # `-PincludeSpike` is passed (settings.gradle.kts), and no workflow ever passed it,
  # so `./gradlew build` compiled zero `:spike:` tasks. The exclusion's stated reason
  # — a signing-less CI runner cannot build the iOS app — is still true, but it covers
  # the Xcode app TARGET, not the Kotlin: spike/src/appleMain is ordinary K/N that
  # compiles with no signing, no simulator and no device. Meanwhile spike/ stopped
  # being a throwaway and became the vehicle for #1712's release-gating hardware test.
  #
  # WHY macOS, AND WHY PATH-FILTERED. `:spike` depends on `:kuilt-nw`, which carries a
  # cinterop (nwshim) — cinterop-bearing Apple targets require a Mac host, so there is
  # no Linux path for this compile (same constraint publish.yml documents).
  #
  # The constraint is CONCURRENCY, not cost. This repo is public, so standard hosted
  # runners — macos-latest included — are free at every size; do NOT re-derive this
  # filter's justification from a billing multiplier, and do not delete the filter on
  # discovering the bill is zero. What binds is that GitHub caps a plan at FIVE
  # concurrent macOS jobs regardless of visibility, on the smallest runner in the fleet
  # (3 vCPU / 7 GB). This workflow fires ~25 runs/hour and the nightly Apple job takes
  # ~11.5 min: an unconditional macOS job here would sit permanently at that 5-job
  # ceiling and queue every PR behind a lane that gates a HARNESS, while the shipped
  # library's own Apple targets stay ungated. So the coverage is split:
  #   - this job (gating)  — a PR that edits :spike sources compiles them, on that PR.
  #   - apple-nightly.yml  — a :kuilt-core/:kuilt-session/:kuilt-nw change that breaks
  #                          :spike WITHOUT touching spike/ is caught within 24 h, and
  #                          that lane already opens a tracking issue on failure.
  # The residual gap is deliberate: latency, not blindness.
  #
  # Compile only — no tests (there are none), no link, no Xcode target, no detekt
  # (:spike deliberately does not apply `kuilt.kmp-library`). All three targets share
  # one appleMain source set; compiling each proves the per-target cinterop + expect/
  # actual wiring as well as the source compatibility.
  spike-compile:
    needs: detect
    if: needs.detect.outputs.spike-inputs == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
      S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      # aarch64 runner: JDK 21-23 miscompile hot integer code under C2 once it warms up (#1597).
      # The x64 (ubuntu) jobs stay on 21 until detekt can run on 25 (#1708).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      # Shares the `konan-macOS-*` cache key with apple-nightly.yml's job, so a PR
      # here normally restores a toolchain the nightly already warmed. No Android SDK
      # step: the macos-latest image ships one, and apple-nightly.yml configures the
      # same Android library modules without it.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile :spike for its Apple targets
        # Same resource caps as apple-nightly.yml, for the same reason: gradle.properties
        # is tuned for a workstation (16 workers, -Xmx4g per daemon) and inheriting that
        # bare onto the 3 vCPU / 7 GB arm64 runner is why that lane was never green
        # before #1299 capped it.
        run: >-
          ./gradlew -PincludeSpike
          :spike:compileKotlinIosArm64
          :spike:compileKotlinIosSimulatorArm64
          :spike:compileKotlinMacosArm64
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Dkotlin.daemon.jvmargs="-Xmx3g"

  # ── ci-required ────────────────────────────────────────────────────────────
  # The SOLE required status check. Aggregates detect + build-jvm + build-native
  # + detekt + dokka + doc-citations + spike-compile + capability-probes.
  # (concurrency-probes runs but is deliberately NOT aggregated — see that job's
  # header and #1768. capability-probes is the deterministic half of that split
  # and IS aggregated, as of #1768's option 2.)
  #
  # Uses if: always() unconditionally — NO draft guard on the JOB. A required
  # check that is itself *skipped* is treated as "passed" by branch protection
  # (the #131 hazard), so ci-required must always RUN to a definite state.
  #
  # Draft handling lives in the STEP (see the draft short-circuit at the top of
  # "Check gate results"): a draft run FAILS the gate explicitly — draft runs
  # are not a merge signal. Nothing was verified (detect and every heavy job
  # carry draft guards), and parking the draft GREEN instead (the #1132
  # ergonomic change) reopened the #131 auto-merge race: ci-required is
  # needs:-gated behind the full build, so the post-ready run's ci-required
  # check run does not EXIST until the build finishes (~10-15 min). For that
  # whole window the draft green is the ONLY ci-required check run on the sha,
  # branch protection is satisfied, and `gh pr ready && gh pr merge --auto`
  # lands the PR before the real build ran (#1275, seen on PR #1264).
  #
  # The draft RED cannot wedge the gate (the concrete #1132 bug) because the
  # concurrency-group split above keeps the ready_for_review run uncancellable:
  # it always completes, and its real ci-required result supersedes the fast
  # draft FAILURE on the same sha. The split is the load-bearing #1132 fix and
  # stays; only the green park is reverted.
  #
  # detect/build-jvm/build-native/detekt/dokka/capability-probes still carry their own
  # draft/docs-only/dokka-inputs guards (cheap jobs don't burn a runner on every draft
  # push). Only ci-required runs unconditionally, so the gate is always in a definite
  # pass/fail state.
  #
  # Invariant: ci-required succeeds if and only if ALL of these hold:
  #   Build gate —
  #     (a) detect succeeded AND docs-only=true AND build-jvm + build-native +
  #         detekt were skipped, OR
  #     (b) detect succeeded AND docs-only=false AND build-jvm=success AND
  #         build-native=success AND detekt=success.
  #   Dokka gate (orthogonal) —
  #     (c) dokka-inputs=true  → dokka=success, OR
  #     (d) dokka-inputs=false → dokka was skipped (or success).
  #   Spike gate (orthogonal) —
  #     (e) spike-inputs=true  → spike-compile=success, OR
  #     (f) spike-inputs=false → spike-compile was skipped (or success).
  #   Deterministic-probe gate — same docs-only guard as the build gate, so judged by
  #   the same rule and evaluated in the same two loops —
  #     (g) docs-only=true  → capability-probes was skipped (or success), OR
  #     (h) docs-only=false → capability-probes=success.
  #
  # The two probe jobs are treated DIFFERENTLY and that asymmetry is #1768's option 2:
  #   - capability-probes IS in `needs:` and in clauses (g)/(h) — its probes are
  #     deterministic, so a red is a real defect essentially every time.
  #   - concurrency-probes is deliberately absent from every clause above and not in
  #     `needs:` at all, so its result cannot influence this gate (#1158). It stays
  #     non-blocking because it also carries the contention/wedge-sensitive probes;
  #     see that job's header for the measurement and for what graduating it needs.
  #
  # Any other combination fails. In particular:
  #   - draft PR → fails explicitly (draft runs are not a merge signal) →
  #     merge blocked until the post-ready run posts a real success.
  #   - a heavy job skipped on a non-docs change → fails → closes the docs→code
  #     race too.
  #   - dokka skipped/failed on a Dokka-input change → fails → closes the
  #     module.md-freezes-the-deploy gap (#1061).
  #   - spike-compile skipped/failed on a :spike-source change → fails → closes the
  #     never-compiled-harness gap (#1796).
  #   - capability-probes skipped/failed on a non-docs change → fails → closes the
  #     regressed-race-merges-green gap (#1768).
  ci-required:
    needs: [detect, build-jvm, build-native, test-result-parity, detekt, dokka, doc-citations, spike-compile, capability-probes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gate results
        run: |
          # Draft short-circuit — a draft run is NOT a merge signal: fail (#131, #1275).
          # Draft runs skip detect and every heavy job, so nothing has been verified.
          # Parking GREEN here (the #1132 ergonomic change) reopened the #131 hole:
          # this job is needs:-gated behind the full build, so the post-ready run's
          # ci-required check run does not exist until the build finishes (~10-15 min)
          # — for that whole window the draft green was the only ci-required on the
          # sha and auto-merge could land the PR before the real build ran (PR #1264).
          # The #1132 wedge stays fixed by the concurrency-group split above: the
          # ready_for_review run is uncancellable, always completes, and its real
          # result supersedes this draft FAILURE on the same sha. Must sit ABOVE all
          # gate logic and trigger ONLY on draft==true — the non-draft path below is
          # unchanged and still requires real green builds.
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "::error::Draft run — not a merge gate. The ready_for_review build produces the real ci-required (see #131, #1275)."
            exit 1
          fi

          DETECT="${{ needs.detect.result }}"
          BUILD_JVM="${{ needs.build-jvm.result }}"
          BUILD_NATIVE="${{ needs.build-native.result }}"
          PARITY="${{ needs.test-result-parity.result }}"
          DETEKT="${{ needs.detekt.result }}"
          DOKKA="${{ needs.dokka.result }}"
          DOC_CITATIONS="${{ needs.doc-citations.result }}"
          SPIKE="${{ needs.spike-compile.result }}"
          CAPABILITY_PROBES="${{ needs.capability-probes.result }}"
          DOCS_ONLY="${{ needs.detect.outputs.docs-only }}"
          DOKKA_INPUTS="${{ needs.detect.outputs.dokka-inputs }}"
          SPIKE_INPUTS="${{ needs.detect.outputs.spike-inputs }}"
          echo "detect:             $DETECT"
          echo "build-jvm:          $BUILD_JVM"
          echo "build-native:       $BUILD_NATIVE"
          echo "test-result-parity: $PARITY"
          echo "detekt:             $DETEKT"
          echo "dokka:              $DOKKA"
          echo "doc-citations:      $DOC_CITATIONS"
          echo "spike-compile:      $SPIKE"
          echo "capability-probes:  $CAPABILITY_PROBES"
          echo "docs-only:          $DOCS_ONLY"
          echo "dokka-inputs:       $DOKKA_INPUTS"
          echo "spike-inputs:       $SPIKE_INPUTS"

          # detect must always succeed — it runs unconditionally.
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect job did not succeed (result: $DETECT)."; exit 1
          fi

          # Dokka gate — ORTHOGONAL to docs-only. A change touching any Dokka input
          # (module.md / *.kt / commonSamples) MUST pass the Dokka module-doc build,
          # so a bad module.md can't merge green and freeze the Pages deploy (#1061).
          # skipped is accepted only when there were no Dokka inputs.
          if [ "$DOKKA_INPUTS" = "true" ]; then
            if [ "$DOKKA" != "success" ]; then
              echo "::error::Change touches Dokka inputs but the Dokka module-doc check did not succeed (result: $DOKKA). skipped is not accepted."; exit 1
            fi
          else
            if [ "$DOKKA" != "skipped" ] && [ "$DOKKA" != "success" ]; then
              echo "::error::dokka had unexpected result: $DOKKA."; exit 1
            fi
          fi

          # Doc-citation gate — ORTHOGONAL to docs-only, like the Dokka gate above and for
          # the same reason: a docs-only PR editing a quoted block is the likeliest way to
          # drift a `<!-- verbatim from … -->` citation, and that path skips the build. The
          # job always runs, so skipped is never acceptable here (#1792).
          if [ "$DOC_CITATIONS" != "success" ]; then
            echo "::error::Doc-citation verification did not succeed (result: $DOC_CITATIONS). skipped is not accepted."; exit 1
          fi

          # Spike gate — ORTHOGONAL to docs-only, same shape as the Dokka gate: the
          # spike-compile job is guarded on its own detect flag (spike-inputs), not on
          # docs-only, so it must be judged against that flag. A change touching :spike
          # Kotlin/build sources MUST compile them; otherwise the job legitimately did
          # not run and `skipped` is the expected, passing result — which is what keeps
          # the ~90% of PRs that never touch spike/ clear of the 5-concurrent-job macOS
          # runner ceiling (#1796).
          if [ "$SPIKE_INPUTS" = "true" ]; then
            if [ "$SPIKE" != "success" ]; then
              echo "::error::Change touches :spike sources but the spike compile did not succeed (result: $SPIKE). skipped is not accepted."; exit 1
            fi
          else
            if [ "$SPIKE" != "skipped" ] && [ "$SPIKE" != "success" ]; then
              echo "::error::spike-compile had unexpected result: $SPIKE."; exit 1
            fi
          fi

          # capability-probes carries the SAME docs-only guard as the heavy jobs
          # (if: docs-only != 'true'), so it is judged by the same rule and rides
          # in both loops below rather than getting a bespoke clause: skipped is
          # correct on the docs-only path, and success is mandatory otherwise.
          # Its non-blocking sibling concurrency-probes is absent here by design
          # — it is not even in `needs:` (#1158 / #1768; see both job headers).
          if [ "$DOCS_ONLY" = "true" ]; then
            # Docs-only path: the heavy jobs must have been skipped (not run).
            # If any somehow ran and failed, that's still a failure.
            for pair in "build-jvm:$BUILD_JVM" "build-native:$BUILD_NATIVE" "test-result-parity:$PARITY" "detekt:$DETEKT" "capability-probes:$CAPABILITY_PROBES"; do
              name="${pair%%:*}"; result="${pair#*:}"
              if [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
                echo "::error::docs-only=true but $name had unexpected result: $result."; exit 1
              fi
            done
            echo "Docs-only change — build and capability probes correctly skipped. Gate green."
          else
            # Code-change path: every heavy job MUST have run and succeeded.
            # skipped here means a job was bypassed without a legitimate
            # docs-only classification — the exact race condition being closed.
            # Treat skipped the same as failure.
            for pair in "build-jvm:$BUILD_JVM" "build-native:$BUILD_NATIVE" "test-result-parity:$PARITY" "detekt:$DETEKT" "capability-probes:$CAPABILITY_PROBES"; do
              name="${pair%%:*}"; result="${pair#*:}"
              if [ "$result" != "success" ]; then
                echo "::error::Non-docs change requires a passing $name (result: $result). skipped is not accepted."; exit 1
              fi
            done
            echo "build-jvm, build-native, test-result-parity, detekt and capability-probes all succeeded. Gate green."
          fi
