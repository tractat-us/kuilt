# JVM/Android-only module. A compiler node is a JVM/server peer that execs a
# bundled `wasm-opt` (Binaryen) subprocess — there is no iOS/macOS/wasmJs
# variant (Apple bans externally-delivered machine code; a browser peer cannot
# fork a process). All optimizer code lives in jvmMain; the off-JVM targets are
# not declared. Declaring a native/wasm target with no source produces no .klib
# and breaks publish.yml with a FileNotFoundException (see #1014), so this module
# opts out of the native + wasm targets that kuilt.kmp-library declares.
kuilt.jvmAndroidOnly=true
