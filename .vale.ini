StylesPath = .vale/styles
MinAlertLevel = error

# Grade limits apply to prose. Vale excludes code and table cells from metrics.
# New guide topics inherit Technical; entry pages must be listed explicitly.
[Writerside/topics/*.md]
BasedOnStyles = Technical
# Writerside's source-inclusion attributes are not reader-facing prose.
BlockIgnores = (?m)^(\{ src="[^"\n]+"[^\n]*\})$

[Writerside/topics/{install,getting-started,quick-start,contract,fabrics,crdt-overview,raft,observability,testing}.md]
BasedOnStyles = Guide, Opening
Technical.Grade = NO
Technical.SentenceLength = NO

[Writerside/topics/{overview,warp,heddle}.md]
BasedOnStyles = Entry
Technical.Grade = NO
Technical.SentenceLength = NO

[README.md]
BasedOnStyles = Technical, Opening
