# kuilt detekt configuration for TEST source sets only.
# Bans production dispatchers and GlobalScope in test code — prevents the
# accidental real-dispatcher-under-runTest class of bug (the root cause of #340).
#
# WHAT THIS FILE ACTUALLY ENFORCES, because it is easy to over-read: exactly one
# rule, ForbiddenImport, catching exactly the `import` form, on exactly the three
# tasks kuilt.detekt-kmp points at this config — detektJvmTest and the two
# androidUnitTest tasks. detekt generates no task for commonTest, nor for
# appleTest/iosTest/macosArm64Test/wasmJsTest or the plain-JVM src/test layout,
# so this rule has never applied to most of kuilt's tests (#1960). Silence it,
# where it does apply, with @file:Suppress("ForbiddenImport").
#
# WHAT ENFORCES THE RULE EVERYWHERE is `forbidProductionDispatcherInTests` in the
# root build.gradle.kts (#1934) — a check-wired source scan, so every test source
# set is covered, and it also sees the fully-qualified
# `kotlinx.coroutines.Dispatchers.Default` spelling that needs no import and is
# therefore invisible to ForbiddenImport by construction. Its escape hatch is a
# line-tight `// ALLOW-realDispatcher: <reason>` on the offending line or the one
# above, and a marker with an empty reason is itself a violation.
#
# @Suppress("ForbiddenMethodCall") is NOT a mechanism here. This header used to
# name it as the sanctioned one; it never was. That rule is configured in neither
# detekt config, and #1329 showed it cannot work in this KMP setup anyway — it
# resolves no kotlin-stdlib callee and silently no-ops. Do not add one.
style:
  ForbiddenImport:
    active: true
    imports:
      # Ban importing Dispatchers in test sources.
      # Default to StandardTestDispatcher(testScheduler) — FIFO at each virtual instant — for
      # any system with concurrent timers + messages (multi-node meshes, Quilter anti-entropy,
      # Raft election/heartbeat loops); prefer the published harnesses (raftSimTest /
      # warpSimTest), which wire it in. UnconfinedTestDispatcher(testScheduler) is acceptable
      # only where eager-inline ordering cannot affect the outcome (single-node, no re-arming
      # timers). See docs/testing-coroutine-determinism.md.
      # Deliberate real-threading harnesses: @file:Suppress("ForbiddenImport") for
      # this rule, plus the `// ALLOW-realDispatcher: <reason>` marker the
      # whole-tree guard requires on the import line itself.
      - reason: "Use StandardTestDispatcher(testScheduler) (UnconfinedTestDispatcher only where eager-inline ordering cannot matter); real dispatchers break virtual-time determinism."
        value: "kotlinx.coroutines.Dispatchers"
      # Ban GlobalScope — unstructured concurrency leaks across test boundaries.
      - reason: "GlobalScope escapes test lifecycle; use runTest's backgroundScope or a CoroutineScope(StandardTestDispatcher(testScheduler)) instead."
        value: "kotlinx.coroutines.GlobalScope"
